    wb.Workbook = { Views: [{ RTL: true }] };
    const buf = X.write(wb, { bookType: "xlsx", type: "array" });
    const label = kinds.length === 3 ? "הכול" : kinds.map(k => names[k]).join("-");
    await FileOut.save(`יומי-${label}-${E.from}-עד-${E.to}.xlsx`, new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  },
};

/* ---------------- Backup ---------------- */
const Backup = {
  export() {
    const payload = { app: "yomi", format: 1, exportedAt: new Date().toISOString(), data: Store.state };
    return FileOut.save(`יומי-גיבוי-${U.today()}.json`, JSON.stringify(payload, null, 1), "application/json");
  },
  async restore(file) {
    try {
      const txt = await file.text(); const obj = JSON.parse(txt); const data = obj && obj.app === "yomi" ? obj.data : obj;
      if (!Model.validate(data)) { UI.toast("הקובץ לא נראה כמו גיבוי של יומי", "alert"); return; }
      if (!(await UI.confirm("לשחזר מהקובץ?", `${(data.transactions || []).length} פעולות ו־${(data.accounts || []).length} חשבונות. הנתונים הנוכחיים יוחלפו.`, "שחזור", true))) return;
      Store.replace(data); Engine.processDue(); Store.save(); UI.go("home"); UI.toast("הנתונים שוחזרו", "shield");
    } catch (e) { UI.toast("לא הצלחנו לקרוא את הקובץ", "alert"); }
  },
};

/* ---------------- PWA ---------------- */
const PWA = {
  canPrompt: false, deferred: null,
  iconDataURL(size = 180) {
    try {
      const c = document.createElement("canvas"); c.width = c.height = size; const g = c.getContext("2d");
      const gr = g.createLinearGradient(0, 0, size, size); gr.addColorStop(0, "#3B2FD0"); gr.addColorStop(1, "#6A3BE0"); g.fillStyle = gr; g.fillRect(0, 0, size, size);
      const rg = g.createRadialGradient(0, 0, 0, 0, 0, size * .9); rg.addColorStop(0, "rgba(20,169,157,.9)"); rg.addColorStop(1, "rgba(20,169,157,0)"); g.fillStyle = rg; g.fillRect(0, 0, size, size);
      g.lineCap = "round"; g.lineWidth = size * .1; g.strokeStyle = "rgba(255,255,255,.22)"; g.beginPath(); g.arc(size / 2, size / 2, size * .3, 0, Math.PI * 2); g.stroke();
      g.strokeStyle = "#fff"; g.beginPath(); g.arc(size / 2, size / 2, size * .3, -Math.PI / 2, Math.PI * .9); g.stroke();
      return c.toDataURL("image/png");
    } catch (e) { return null; }
  },
  init() {
    window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); PWA.deferred = e; PWA.canPrompt = true; });
    const icon = PWA.iconDataURL();
    if (icon) { const l = document.createElement("link"); l.rel = "apple-touch-icon"; l.href = icon; document.head.appendChild(l); const f = document.createElement("link"); f.rel = "icon"; f.href = PWA.iconDataURL(64); document.head.appendChild(f); }
    // אירוח עצמאי (GitHub Pages / Netlify): manifest + service worker לעבודה אופליין
    if (!window.claude && /^https?:/.test(location.protocol)) {
      const m = document.createElement("link"); m.rel = "manifest"; m.href = "manifest.webmanifest"; document.head.appendChild(m);
      const ati = document.createElement("link"); ati.rel = "apple-touch-icon"; ati.href = "apple-touch-icon.png"; document.head.appendChild(ati);
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  },
  async install() { if (!PWA.deferred) return; PWA.deferred.prompt(); try { await PWA.deferred.userChoice; } catch (e) {} PWA.deferred = null; PWA.canPrompt = false; UI.refresh(); },
};

  rerender(focusLast) { const y = window.scrollY; UI.render(); window.scrollTo({ top: y }); if (focusLast) { const rows = UI.app.querySelectorAll(".ob-row"); const r = rows[rows.length - 1]; const i = r && r.querySelector("input"); if (i) { i.focus(); r.scrollIntoView({ block: "center", behavior: "smooth" }); } } },
  validate() {

    const first = s.accounts[0] ? s.accounts[0].id : null;
    const A = k => map[k] || first;
    s.settings.defaultAccountId = map.k0 || map.b0 || first;
    s.settings.payday = Number(d.salary.day) || 1;

      else { s.transactions.push(Engine.tx({ type: "income", amount: s.settings.salary.amount, accountId: s.settings.salary.accountId, categoryId: "ci1", date: today, status: "pending", note: "משכורת (ממתינה)" })); }
      s.runs.salary = today;
    }
    d.incomes.filter(r => U.num(r.amount) > 0).forEach(r => s.recurring.push({ id: U.uid(), type: "income", name: r.name.trim() || "הכנסה קבועה", amount: U.num(r.amount), day: Number(r.day), accountId: A(r.acc), categoryId: "ci5", startDate: today, endDate: null, active: true }));
    d.expenses.filter(r => U.num(r.amount) > 0).forEach(r => s.recurring.push({ id: U.uid(), type: "expense", name: r.name.trim() || "הוצאה קבועה", amount: U.num(r.amount), day: Number(r.day), accountId: A(r.acc), categoryId: r.cat, startDate: today, endDate: null, active: true }));
    Engine.backfillHistoric(rule => rule.kind === "recurring");

      const left = Math.round(U.num(r.left)), per = U.num(r.per);

    });
    if (d.goal.on && U.num(d.goal.target) > 0) {
      const g = { id: U.uid(), name: d.goal.name.trim() || "חיסכון", target: U.num(d.goal.target), initial: U.num(d.goal.initial), monthly: U.num(d.goal.monthly), fromAccountId: A(d.goal.acc), day: s.settings.payday, startDate: today, icon: "shield", color: "#3BB273", deadline: "", archived: false };
      s.goals.push(g);
      // ההפקדה של החודש הנוכחי נחשבת בחישוב (כאילו הופרשה בתחילת החודש)
      if (g.monthly > 0) s.transactions.push(Engine.tx({ type: "transfer", amount: g.monthly, accountId: g.fromAccountId, goalId: g.id, goalDir: "in", date: p.start < today ? p.start : today, historic: p.start < today, note: "הפקדה ל" + g.name, source: { kind: "goal", key: "goal:" + g.id + ":" + p.start } }));
      s.runs["goal:" + g.id] = today;
    }
    s.accounts.filter(a => a.type === "credit").forEach(a => { const bd = U.clampDate(new Date().getFullYear(), new Date().getMonth(), a.billingDay); s.runs["credit:" + a.id] = today >= bd ? today : U.add(today, -1); });
    s.meta.onboarded = true;
    Engine.processDue();
    if (p.start < today) {
      const st0 = Engine.stats(); const pre = String(d.pre).trim() !== "" ? U.num(d.pre) : Math.max(0, Math.round(st0.base * U.diff(p.start, today)));
      if (pre > 0) s.transactions.push(Engine.tx({ type: "expense", amount: pre, accountId: s.settings.defaultAccountId, categoryId: "c12", date: U.add(today, -1), historic: true, note: "הוצאות לפני תחילת השימוש" }));
    }
    Store.state = s; Store.save({ silent: true });
    Onboarding.d = null; Onboarding.step = 0; UI.go("home");
    setTimeout(() => UI.toast("הכול מוכן. זה הסכום שלך להיום", "sparkle", { ms: 3500 }), 500);
  },
};

  rules() {

  async send(text) {
    if (Assistant.busy) return;

    const sm = await Caps.get("sample");
    let reply = null;
    if (sm) {

        if (lim && lim.tools) opts.tools = Assistant.tools();
        const input = [{ role: "user", content: Assistant.rules() + (opts.tools ? "" : "\n\nמצב נוכחי (JSON): " + JSON.stringify(Assistant.overview())) }, { role: "assistant", content: "הבנתי." }, ...Assistant.turns.slice(-10)];
        const res = await sm(input, opts);

        Assistant.turns.pop();

        if (e && e.code === "rate_limited") reply = "יותר מדי בקשות ברצף. נסו שוב בעוד רגע.";

  /* מצב בסיסי ללא חיבור ל-Claude: פענוח פקודות פשוטות */
  local(text) {
    const t = text.replace(/[₪,]/g, " ").replace(/\s+/g, " ").trim();
    const m = t.match(/(\d+(?:\.\d+)?)/); const amount = m ? Number(m[1]) : null;
    const st = Engine.stats();
    if (/מה אם|אם אקנה|אם אוציא/.test(t) && amount) { const n = (t.match(/(\d+)\s*תשלומים/) || [])[1]; const b = Engine.stats({ extra: amount / (Number(n) || 1) }); return `אם תוציא ${U.money(amount)}${n ? ` ב־${n} תשלומים` : ""}, יישארו לך כ־${U.money(b.avgAfterToday, { round: true })} ליום עד המשכורת, במקום ${U.money(st.avgAfterToday, { round: true })}.${b.avgAfterToday < 0 ? " זה יכניס אותך למינוס החודש." : ""}`; }
    if (/כמה (נשאר|פנוי|אפשר|מותר)|להיום/.test(t) && !amount) return st.available >= 0 ? `נשארו לך ${U.money(st.available, { round: true })} להיום, מתוך ${U.money(st.todayBudget, { round: true })}. עד המשכורת ${st.daysLeft} ימים.` : `חרגת היום ב־${U.money(-st.available, { round: true })}. מחר הסכום היומי יתעדכן בהתאם.`;
    if (/יתרה|יתרות|כמה יש לי/.test(t) && !amount) { const tot = Engine.totals(); return `יתרה כוללת: ${U.money(tot.net)}.\n` + Store.state.accounts.filter(a => !a.archived).map(a => `${a.name}: ${U.money(Engine.balance(a.id))}`).join("\n"); }
    if (/הכי הרבה|על מה הוצאתי/.test(t)) { const o = Assistant.overview().expenses_by_category; const top = Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, 3); return top.length ? "החודש הכי הרבה הלך על:\n" + top.map(([n, v]) => `${n}: ${U.money(v)}`).join("\n") : "עוד אין הוצאות החודש."; }
    if (amount) {
      if (/הפקד|משכתי|משיכ|העבר/.test(t)) {
        const cash = Store.state.accounts.find(a => a.type === "cash" && !a.archived), bank = Store.state.accounts.find(a => a.type === "bank" && !a.archived);
        if (cash && bank) { const dep = /הפקד/.test(t); try { Assistant.doTransfer({ amount, from: dep ? cash.name : bank.name, to: dep ? bank.name : cash.name }); return `בוצע. ${dep ? "הפקדת" : "משכת"} ${U.money(amount)}.`; } catch (e) { return e.message; } }
      }
      const income = /הכנס|קיבלתי|נכנס|משכורת|בונוס|החזר/.test(t);
      const words = t.replace(/(\d+(?:\.\d+)?)/, " ").replace(/הוסף|תוסיף|תרשום|רשום|הוצאה|הכנסה|של|על|ב|שקל|שקלים|ש"ח|קיבלתי|שילמתי|קניתי|נכנס|לי/g, " ").split(" ").filter(w => w.length > 1);
      let cat = null; for (const w of [words.join(" "), ...words]) { cat = Assistant.catByName(w, income ? "income" : "expense"); if (cat) break; }
      const acc = words.map(w => Assistant.accByName(w)).find(Boolean);
      try { const r = Assistant.doAdd({ type: income ? "income" : "expense", amount, category: cat ? cat.name : null, account: acc ? acc.name : null }); return `רשמתי. ${income ? "" : `נשארו לך ${U.money(r.available_today_now)} להיום.`}`; } catch (e) { return e.message; }
    }
    return "לא הבנתי עד הסוף. נסו למשל: \"הוצאה 50 דלק\", \"קיבלתי 300 מתנה\", \"כמה נשאר להיום\" או \"מה אם אקנה ב־2000\".";
  },
};

/* ---------------- Boot ---------------- */
const App = {
  boot() {
    UI.app = document.getElementById("app");

      const el = e.target.closest("[data-act]"); if (!el || !UI.app.contains(el) && !el.closest(".sheet")) return;
      if (el.tagName === "A") e.preventDefault();

    });
    document.addEventListener("change", e => {
      const t = e.target;
      if (t.id === "restoreFile" && t.files[0]) { Backup.restore(t.files[0]); t.value = ""; }
      if (t.id === "exFrom" || t.id === "exTo") { const E = Views._ex; E[t.id === "exFrom" ? "from" : "to"] = t.value; E.preset = null; if (E.from > E.to) { const x = E.from; E.from = E.to; E.to = x; } UI.refresh(); }
    });

    document.addEventListener("submit", e => { if (e.target.id === "setForm") { e.preventDefault(); const v = Form.read(e.target); const s = Store.state; const pdChanged = Number(v.payday) !== s.settings.payday; s.meta.name = v.name.trim(); s.settings.payday = Number(v.payday) || 1; s.settings.defaultAccountId = v.defaultAccountId; if (pdChanged) s.runs.salary = U.add(U.today(), -1); Store.save(); UI.toast(pdChanged ? "נשמר. החודש הפיננסי עודכן" : "נשמר"); } });

    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (Store.state.settings.theme === "auto") UI.refresh(); });

    UI.render();
    Store.initCloud();

/* =====================================================================
   גרסה 2 — מתחבר דרך Hooks בלי לשנות את הליבה
   ===================================================================== */
const V2 = {
  /* ---------- תקציב לפי קטגוריה ---------- */
  catSpent(catId, p = Engine.period()) { return U.sum(Store.state.transactions.filter(t => t.type === "expense" && t.categoryId === catId && t.date >= p.start && t.date <= p.end), t => t.amount); },
  budgets() {
    const p = Engine.period();
    return Store.state.categories.filter(c => c.kind === "expense" && c.budget > 0).map(c => { const spent = V2.catSpent(c.id, p); return { c, spent, pct: spent / c.budget, left: c.budget - spent }; }).sort((a, b) => b.pct - a.pct);
  },
  budgetColor(pct) { return pct >= 1 ? "var(--expense)" : pct >= (Store.state.settings.budgetAlert || .8) ? "var(--warn)" : "var(--income)"; },
  suggestBudget(catId) {
    const cur = Engine.period(); let p = Engine.prevPeriod(cur), vals = [];
    for (let i = 0; i < 3; i++) { const v = V2.catSpent(catId, p); if (v > 0) vals.push(v); p = Engine.prevPeriod(p); }
    return vals.length ? Math.ceil(U.sum(vals) / vals.length / 50) * 50 : null;
  },
  budgetRow(b) {
    return `<button class="item" data-act="budgetEdit" data-id="${b.c.id}" style="flex-direction:column;align-items:stretch;gap:8px"><span class="row">${UI.badge(b.c.icon, b.c.color)}<span class="grow"><span class="t" style="display:block">${U.esc(b.c.name)}</span><span class="s" style="display:block">${b.left >= 0 ? `נשארו ${U.money(b.left, { round: true })}` : `חריגה של ${U.money(-b.left, { round: true })}`}</span></span><span class="amt num">${U.money(b.spent, { round: true })} <span class="faint" style="font-weight:400;font-size:13px">/ ${U.money(b.c.budget, { round: true })}</span></span></span>${UI.bar(b.pct, V2.budgetColor(b.pct))}</button>`;
  },
  afterTx(t) {
    if (t.type !== "expense") return; const c = Engine.cat(t.categoryId); if (!c || !(c.budget > 0)) return;
    const spent = V2.catSpent(c.id), before = spent - t.amount, th = Store.state.settings.budgetAlert || .8;
    if (before < c.budget && spent >= c.budget) setTimeout(() => UI.toast(`עברת את תקציב ${c.name} (${U.money(spent, { round: true })} מתוך ${U.money(c.budget, { round: true })})`, "alert", { ms: 4500 }), 700);
    else if (before < c.budget * th && spent >= c.budget * th) setTimeout(() => UI.toast(`הגעת ל־${Math.round(spent / c.budget * 100)}% מתקציב ${c.name}`, "alert", { ms: 4500 }), 700);
  },

  /* ---------- תובנות אוטומטיות ---------- */
  insights() {
    const s = Store.state, cur = Engine.period(), prev = Engine.prevPeriod(cur), today = U.today(), out = [];
    const elapsed = U.diff(cur.start, today) + 1;
    const prevEnd = U.min(prev.end, U.add(prev.start, elapsed - 1));
    const exp = (from, to) => s.transactions.filter(t => t.type === "expense" && !t.historic && t.date >= from && t.date <= to);
    const nowList = exp(cur.start, today), prevList = exp(prev.start, prevEnd);
    const hasPrev = s.transactions.some(t => !t.historic && t.date < cur.start);
    const st = Engine.stats();
    // קצב החודש
    const variable = nowList.filter(t => !Engine.isPlanned(t)), varSpent = U.sum(variable, t => t.amount) + U.sum(s.transactions.filter(t => t.historic && t.type === "expense" && !Engine.isPlanned(t) && t.date >= cur.start), t => t.amount);
    if (elapsed >= 3 && st.free > 0) {
      const projected = varSpent / elapsed * cur.days, diff = st.free - projected;
      out.push(diff >= 0 ? { icon: "chart", color: "#3BB273", w: 2, text: `בקצב הנוכחי תסיים את החודש עם עודף של כ־${U.money(diff, { round: true })}.` } : { icon: "alert", color: "#FF8A5C", w: 5, text: `בקצב הנוכחי תחרוג בכ־${U.money(-diff, { round: true })} עד המשכורת. כדי לסגור את הפער: ${U.money(st.avgAfterToday, { round: true })} ליום מעכשיו.` });
    }
    // השוואה לחודש שעבר לפי קטגוריה (אותו מספר ימים)
    if (hasPrev) {
      const by = l => { const m = {}; l.forEach(t => { m[t.categoryId] = (m[t.categoryId] || 0) + t.amount; }); return m; };
      const a = by(nowList), b = by(prevList);
      const ch = Object.keys({ ...a, ...b }).map(id => ({ id, now: a[id] || 0, was: b[id] || 0 })).filter(x => x.was >= 50 && Math.abs(x.now - x.was) >= 50).map(x => ({ ...x, pct: (x.now - x.was) / x.was }));
      ch.filter(x => x.pct >= .2).sort((x, y) => (y.now - y.was) - (x.now - x.was)).slice(0, 2).forEach(x => { const c = Engine.cat(x.id); if (c) out.push({ icon: c.icon, color: c.color, w: 4, text: `הוצאת ${Math.round(x.pct * 100)}% יותר על ${c.name} מאשר באותה תקופה בחודש שעבר (${U.money(x.now, { round: true })} לעומת ${U.money(x.was, { round: true })}).` }); });
      ch.filter(x => x.pct <= -.2).sort((x, y) => (x.now - x.was) - (y.now - y.was)).slice(0, 1).forEach(x => { const c = Engine.cat(x.id); if (c) out.push({ icon: c.icon, color: c.color, w: 3, text: `יפה: ירידה של ${Math.round(-x.pct * 100)}% ב${c.name} לעומת החודש שעבר.` }); });
      const tn = U.sum(nowList, t => t.amount), tp = U.sum(prevList, t => t.amount);
      if (tp > 0 && Math.abs(tn - tp) / tp >= .1) out.push({ icon: tn > tp ? "arrowUp" : "arrowDown", color: tn > tp ? "#FF8A5C" : "#3BB273", w: 1, text: `סה״כ ההוצאות עד היום ${tn > tp ? "גבוהות" : "נמוכות"} ב־${Math.round(Math.abs(tn - tp) / tp * 100)}% מאותה נקודה בחודש שעבר.` });
    }
    // ימים בלי הוצאות משתנות
    let noSpend = 0; for (let i = 0; i < elapsed - 1; i++) { const d = U.add(cur.start, i); if (!variable.some(t => t.date === d) && d >= (s.transactions.filter(t => !t.historic).map(t => t.date).sort()[0] || today)) noSpend++; }
    if (noSpend >= 2) out.push({ icon: "smile", color: "#2EC4B6", w: 1, text: `${noSpend} ימים החודש בלי אף הוצאה משתנה. כל יום כזה מגדיל את הסכום היומי.` });
    // הקטגוריה הגדולה
    const by = {}; variable.forEach(t => { by[t.categoryId] = (by[t.categoryId] || 0) + t.amount; });
    const top = Object.entries(by).sort((a, b) => b[1] - a[1])[0]; const tot = U.sum(Object.values(by));
    if (top && tot > 0 && top[1] / tot >= .35) { const c = Engine.cat(top[0]); if (c) out.push({ icon: c.icon, color: c.color, w: 2, text: `${Math.round(top[1] / tot * 100)}% מההוצאות המשתנות החודש הלכו על ${c.name}.` }); }
    // תקציבים
    V2.budgets().filter(b => b.pct >= 1).slice(0, 2).forEach(b => out.push({ icon: "alert", color: "#FF8A5C", w: 4, text: `חרגת מתקציב ${b.c.name} ב־${U.money(-b.left, { round: true })}.` }));
    if (!hasPrev) out.push({ icon: "bulb", color: "#7C6CFF", w: 0, text: "אחרי חודש פיננסי מלא יופיעו כאן השוואות לחודש הקודם — על מה הוצאת יותר ועל מה פחות." });
    return out.sort((a, b) => b.w - a.w);
  },

  /* ---------- הוספה מהירה: חזרה על פעולות נפוצות בלחיצה ---------- */
  favorites() {
    const s = Store.state, since = U.add(U.today(), -45), m = {};
    s.transactions.filter(t => t.type === "expense" && !t.source && !t.historic && t.date >= since).forEach(t => { const k = t.categoryId + "|" + t.amount + "|" + t.accountId; m[k] = m[k] || { n: 0, t }; m[k].n++; if (t.date > m[k].t.date) m[k].t = t; });
    return Object.values(m).filter(x => x.n >= 2).sort((a, b) => b.n - a.n).slice(0, 4).map(x => x.t);
  },
  catUsage() { const m = {}; const since = U.add(U.today(), -60); Store.state.transactions.filter(t => t.date >= since && t.categoryId).forEach(t => { m[t.categoryId] = (m[t.categoryId] || 0) + 1; }); return m; },

  /* ---------- תזכורות ---------- */
  reminderBanners() {
    const s = Store.state, R = s.settings.reminders, t = U.today(), out = [], dis = s.ui.dismissed || {};
    const now = new Date(), hm = U.pad(now.getHours()) + ":" + U.pad(now.getMinutes());
    if (R.daily && hm >= R.dailyTime && !s.transactions.some(x => x.date === t && !x.source && x.createdAt > new Date(t + "T00:00").getTime()) && dis["daily:" + t] !== true)
      out.push(`<div class="banner info">${ico("bell")}<span class="grow">עוד לא רשמת כלום היום. היו הוצאות?</span><button class="btn" data-act="add">הוספה</button><button class="btn" data-act="dismiss" data-k="daily:${t}">לא היו</button></div>`);
    if (R.upcoming) {
      const end = U.add(t, R.upcomingDays || 2);
      const up = Engine.projected(U.add(t, 1), end).filter(x => x.type === "expense" || (x.type === "transfer" && x.source && x.source.kind === "credit")).filter(x => dis["up:" + x.source.key] !== true);
      if (up.length) {
        const first = up[0], more = up.length - 1;
        out.push(`<div class="banner">${ico("cal")}<span class="grow">${U.dayLabel(first.date)} יורד: ${U.esc(Engine.label(first))} ${U.money(first.amount, { round: true })}${more ? ` ועוד ${more}` : ""}</span><button class="btn" data-act="dismissUp" data-keys="${up.map(x => x.source.key).join(",")}">הבנתי</button></div>`);
      }
    }
    return out.join("");
  },
  _timer: null,
  scheduleNotify() {
    clearTimeout(V2._timer); const R = Store.state.settings.reminders;
    if (!R.notify || !R.daily || !("Notification" in window) || Notification.permission !== "granted") return;
    const [h, m] = R.dailyTime.split(":").map(Number), at = new Date(); at.setHours(h, m, 0, 0); if (at <= new Date()) at.setDate(at.getDate() + 1);
    V2._timer = setTimeout(() => { try { const t = U.today(); if (!Store.state.transactions.some(x => x.date === t && !x.source)) new Notification("יומי", { body: `נשארו לך ${U.money(Engine.stats().available, { round: true })} להיום. רוצה לרשום הוצאות?`, tag: "yomi-daily" }); } catch (e) {} V2.scheduleNotify(); }, Math.min(at - new Date(), 2147000000));
  },
};

/* ---------- Views (v2) ---------- */
Object.assign(Views, {
  budgets() {
    const s = Store.state, list = V2.budgets(), none = s.categories.filter(c => c.kind === "expense" && !(c.budget > 0));
    const total = U.sum(list, b => b.c.budget), spent = U.sum(list, b => b.spent);
    return `${UI.topbar("תקציבים", `לחודש הפיננסי ${Engine.periodLabel(Engine.period())}`, "", true)}
      ${list.length ? `<section class="card"><div class="row" style="margin-bottom:10px"><span class="grow muted" style="font-size:14px">סה״כ בתקציבים</span><b class="num">${U.money(spent, { round: true })} / ${U.money(total, { round: true })}</b></div>${UI.bar(total ? spent / total : 0, V2.budgetColor(total ? spent / total : 0))}</section>
        <section class="card list">${list.map(V2.budgetRow).join("")}</section>` : UI.empty("עוד לא הוגדרו תקציבים", "<div>קבעו סכום חודשי לקטגוריה ותקבלו התראה כשמתקרבים לגבול.</div>")}
      ${none.length ? `<h3 class="sec-title">הגדרת תקציב לקטגוריה</h3><section class="card list">${none.map(c => { const sg = V2.suggestBudget(c.id); return `<button class="item" data-act="budgetEdit" data-id="${c.id}">${UI.badge(c.icon, c.color)}<span class="grow"><span class="t" style="display:block">${U.esc(c.name)}</span>${sg ? `<span class="s" style="display:block">הצעה לפי חודשים קודמים: ${U.money(sg)}</span>` : ""}</span><span class="link">${ico("plus", "sm")}</span></button>`; }).join("")}</section>` : ""}
      <section class="card"><h2>מתי להתריע</h2><div class="seg">${[[.7, "70%"], [.8, "80%"], [.9, "90%"]].map(([v, l]) => `<button data-act="budgetAlert" data-v="${v}" class="${(s.settings.budgetAlert || .8) === v ? "on" : ""}">${l}</button>`).join("")}</div></section>`;
  },
  insights() {
    const list = V2.insights();
    return `${UI.topbar("תובנות", "מתעדכן אחרי כל פעולה", "", true)}<section class="card list">${list.map(i => `<div class="item" style="align-items:flex-start">${UI.badge(i.icon, i.color)}<span class="grow" style="font-size:15px;line-height:1.55;padding-top:8px">${U.esc(i.text)}</span></div>`).join("")}</section>`;
  },
  whatif() {
    const W = Views._wi || (Views._wi = { amount: "", n: 1 });
    return `${UI.topbar("מה אם?", "בדיקה לפני קנייה — שום דבר לא נשמר", "", true)}
      <section class="card"><label class="field"><span>כמה זה עולה</span><input class="input num" id="wiAmt" inputmode="decimal" placeholder="₪2,000" value="${U.esc(W.amount)}" style="font-size:22px;text-align:center"></label>
        <div class="field"><span>תשלומים</span><div class="chips">${[1, 2, 3, 6, 10, 12].map(n => `<button class="chip ${W.n === n ? "on" : ""}" data-act="wiN" data-n="${n}">${n === 1 ? "תשלום אחד" : n}</button>`).join("")}</div></div></section>
      <div id="wiOut">${V2.whatifOut()}</div>`;
  },
});
V2.whatifOut = () => {
  const W = Views._wi, amt = U.num(W.amount);
  if (!(amt > 0)) return `<p class="muted" style="text-align:center">הקלידו סכום כדי לראות את ההשפעה</p>`;
  const now = Engine.stats(), per = amt / W.n, after = Engine.stats({ extra: per });
  const ok = after.avgAfterToday >= 0, ratio = now.avgAfterToday > 0 ? Math.max(0, after.avgAfterToday / now.avgAfterToday) : 0;
  return `<section class="card" style="text-align:center"><div class="muted" style="font-size:14px">יישאר לך ליום עד המשכורת</div>
    <div class="num ${ok ? "" : "exp"}" style="font-size:48px;font-weight:600;letter-spacing:-.03em">${U.money(after.avgAfterToday, { round: true })}</div>
    <div class="muted" style="font-size:14px">במקום ${U.money(now.avgAfterToday, { round: true })} · ${now.daysLeft} ימים</div>
    <div style="margin:14px 0 6px">${UI.bar(ratio, ok ? (ratio > .6 ? "var(--income)" : "var(--warn)") : "var(--expense)")}</div>
    <p style="margin:12px 0 0;font-size:14.5px">${!ok ? `הקנייה תכניס אותך למינוס של ${U.money(-after.avgAfterToday * now.daysLeft, { round: true })} החודש.` : W.n > 1 ? `${W.n} תשלומים של ${U.money(per)}. כל אחד מהחודשים הבאים יקטן בכ־${U.money(per / 30.4, { round: true })} ליום.` : ratio < .5 ? "זה יותר מחצי מהגמישות שנשארה לך החודש." : "נשאר מרווח סביר."}</p></section>
    <div class="btn-row"><button class="btn primary" data-act="wiBuy">${ico("check", "sm")}קניתי — לרשום</button></div>`;
};

/* ---------- Actions (v2) ---------- */
Object.assign(Actions, {
  budgetEdit: d => {
    const c = Engine.cat(d.id); if (!c) return; const sg = V2.suggestBudget(c.id);
    Form.open({
      title: "תקציב: " + c.name, fields: [{ name: "budget", label: "סכום לחודש", type: "amount", autofocus: true }, ...(sg ? [{ name: "n", type: "note", text: `ממוצע החודשים הקודמים: ${U.money(sg)}` }] : [])],
      values: { budget: c.budget || sg || "" }, deleteLabel: "הסרת תקציב",
      onSave: v => { const b = U.num(v.budget); if (!(b > 0)) return "הזינו סכום"; c.budget = b; Store.save(); UI.toast("התקציב נשמר"); },
      onDelete: c.budget ? async () => { c.budget = null; Store.save(); return true; } : null,
    });
  },
  budgetAlert: d => { Store.state.settings.budgetAlert = Number(d.v); Store.save(); },
  dismiss: d => { Store.state.ui.dismissed[d.k] = true; Store.save(); },
  dismissUp: d => { d.keys.split(",").forEach(k => { Store.state.ui.dismissed["up:" + k] = true; }); Store.save(); },
  wiN: d => { Views._wi.n = Number(d.n); UI.refresh(); },
  wiBuy: () => {
    const W = Views._wi, amt = U.num(W.amount); if (!(amt > 0)) return;
    if (W.n > 1) { Actions.installmentEdit({}); setTimeout(() => { const f = document.querySelector(".sheet form"); if (!f) return; f.querySelector('[name="total"]').value = amt; f.querySelector('[name="count"]').value = W.n; }, 60); }
    else TxSheet.open({ amount: amt });
  },
  quickRepeat: d => {
    const src = Store.state.transactions.find(t => t.id === d.id); if (!src) return;
    const t = Engine.addTx({ type: "expense", amount: src.amount, categoryId: src.categoryId, accountId: src.accountId, note: src.note });
    Store.save(); Hooks.afterTxSave.forEach(f => f(t));
    UI.toast(`נוספה הוצאה ${U.money(src.amount)}`, "zap", { undo: () => { Engine.removeTx(t.id); Store.save(); } });
  },
  remToggle: d => {
    const R = Store.state.settings.reminders; R[d.k] = !R[d.k];
    if (d.k === "notify" && R.notify) {
      if (!("Notification" in window)) { R.notify = false; UI.toast("הדפדפן הזה לא תומך בהתראות", "alert"); }
      else Notification.requestPermission().then(p => { if (p !== "granted") { R.notify = false; Store.save(); UI.toast("ההתראות לא אושרו בדפדפן", "alert"); } else { V2.scheduleNotify(); UI.toast("התראות הופעלו", "bell"); } }).catch(() => { R.notify = false; Store.save(); });
    }
    Store.save(); V2.scheduleNotify();
  },
});
Object.assign(Views, {
  reminders() {
    const R = Store.state.settings.reminders, sw = (k, label, hint) => `<div class="toggle"><span>${label}${hint ? `<span class="faint" style="display:block;font-size:12.5px">${hint}</span>` : ""}</span><button class="switch ${R[k] ? "on" : ""}" role="switch" aria-checked="${!!R[k]}" data-act="remToggle" data-k="${k}"></button></div>`;
    return `${UI.topbar("תזכורות", "", "", true)}
      <section class="card">${sw("daily", "תזכורת יומית להזנה", "מופיעה במסך הבית אם עוד לא רשמת כלום")}
        <label class="field"><span>באיזו שעה</span><input class="input" type="time" id="remTime" value="${R.dailyTime}"></label></section>
      <section class="card">${sw("upcoming", "הוראות קבע וחיובים קרובים", "התראה במסך הבית לפני שכסף יורד")}
        <div class="field"><span>כמה ימים מראש</span><div class="seg">${[1, 2, 3, 7].map(n => `<button data-act="remDays" data-n="${n}" class="${R.upcomingDays === n ? "on" : ""}">${n === 1 ? "יום" : n + " ימים"}</button>`).join("")}</div></div></section>
      <section class="card">${sw("notify", "התראות בדפדפן", "")}<p class="faint" style="font-size:12.5px;margin:-4px 0 0">ההתראה נשלחת כשהאתר פתוח (גם ברקע). התראות כשהאתר סגור לגמרי דורשות שרת — נוסיף כשנעבור לאפליקציה.</p></section>`;
  },
});
Actions.remDays = d => { Store.state.settings.reminders.upcomingDays = Number(d.n); Store.save(); };

/* ---------- חיבור לנקודות ההרחבה ---------- */
Hooks.afterTxSave.push(V2.afterTx);
Hooks.homeTop.push(() => V2.reminderBanners());
Hooks.homeCards.push((st, side) => {
  if (side !== "left") return "";
  const fav = V2.favorites(), ins = V2.insights().slice(0, 4), bud = V2.budgets().slice(0, 3);
  let h = "";
  if (fav.length) h += `<div class="chips scroll" style="margin-bottom:14px" aria-label="הוספה מהירה">${fav.map(t => { const c = Engine.cat(t.categoryId); return `<button class="chip" data-act="quickRepeat" data-id="${t.id}">${ico("zap", "sm")}${U.money(t.amount)} ${U.esc(c ? c.name : "")}</button>`; }).join("")}</div>`;
  if (ins.length) h += `<div class="insights">${ins.map(i => `<button class="insight" data-act="push" data-view="insights" style="text-align:start">${UI.badge(i.icon, i.color)}<span>${U.esc(i.text)}</span></button>`).join("")}</div>`;
  if (bud.length) h += `<section class="card"><h2>${ico("chart", "sm")}תקציבים<span class="spacer"></span><button class="link" data-act="push" data-view="budgets">הכול</button></h2><div class="list">${bud.map(V2.budgetRow).join("")}</div></section>`;
  return h;
});
Hooks.moreItems.push(row => row("budgets", "chart", "תקציבים", V2.budgets().length ? `${V2.budgets().length} קטגוריות עם תקציב` : "הגדרת סכום לכל קטגוריה", "#F2B33D")
  + row("insights", "bulb", "תובנות", "השוואות לחודש הקודם וקצב הוצאה", "#7C6CFF")
  + row("whatif", "flask", "מה אם?", "כמה יישאר לי ליום אם אקנה…", "#2EC4B6")
  + row("reminders", "bell", "תזכורות", "הזנה יומית וחיובים קרובים", "#F25F8B"));
Hooks.catFormFields.push({ name: "budget", label: "תקציב חודשי", hint: "לא חובה", type: "amount", expenseOnly: true });
Hooks.onBoot.push(() => {
  document.addEventListener("input", e => {
    if (e.target.id === "wiAmt") { Views._wi.amount = e.target.value.replace(/[^\d.]/g, ""); const o = document.getElementById("wiOut"); if (o) { o.innerHTML = V2.whatifOut(); UI.after(); } }
  });
  document.addEventListener("change", e => { if (e.target.id === "remTime") { Store.state.settings.reminders.dailyTime = e.target.value || "21:00"; Store.save(); V2.scheduleNotify(); } });
  V2.scheduleNotify();
  // רענון באנרים של תזכורת כשמגיעה השעה
  setInterval(() => { if (Store.state.meta.onboarded && !UI._sheets.length && !UI.route.stack.length && UI.route.tab === "home") UI.refresh(); }, 5 * 60000);
});
App.boot();
</script>
</body>
</html>
