<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1230" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#EEF1FA" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="יומי">
<title>יומי · כמה פנוי לי היום</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================= TOKENS ================= */
:root{
  --font-ui:"IBM Plex Sans Hebrew","Rubik","Segoe UI",Arial,sans-serif;
  --font-num:"Rubik","IBM Plex Sans Hebrew","Segoe UI",Arial,sans-serif;
  --bg:#EEF1FA; --bg-2:#E4E8F6;
  --surface:rgba(255,255,255,.78); --surface-solid:#FFFFFF; --surface-2:#F4F6FC;
  --line:rgba(20,26,60,.08); --line-2:rgba(20,26,60,.14);
  --text:#141A3C; --muted:#5F6890; --faint:#9098BC;
  --accent:#5B4BEB; --accent-2:#0FB5A8; --accent-ink:#FFFFFF;
  --income:#0E9F6E; --income-bg:rgba(14,159,110,.12);
  --expense:#E85A33; --expense-bg:rgba(232,90,51,.12);
  --transfer:#6E78A8; --transfer-bg:rgba(110,120,168,.13);
  --warn:#D99000; --warn-bg:rgba(217,144,0,.13);
  --hero-a:#3B2FD0; --hero-b:#6A3BE0; --hero-c:#0FB5A8;
  --shadow-1:0 1px 2px rgba(20,26,60,.06),0 8px 24px -12px rgba(20,26,60,.18);
  --shadow-2:0 2px 6px rgba(20,26,60,.08),0 24px 48px -20px rgba(40,30,140,.35);
  --glass-blur:saturate(160%) blur(18px);
  --aurora-1:rgba(91,75,235,.16); --aurora-2:rgba(15,181,168,.14); --aurora-3:rgba(232,90,51,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1230; --bg-2:#121942;
  --surface:rgba(30,38,92,.55); --surface-solid:#171E4E; --surface-2:#1C245A;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
  --text:#EEF1FF; --muted:#A1A9D0; --faint:#6E77A6;
  --accent:#8B7CFF; --accent-2:#2EE6D6; --accent-ink:#0D1230;
  --income:#3BE0A0; --income-bg:rgba(59,224,160,.13);
  --expense:#FF8A5C; --expense-bg:rgba(255,138,92,.14);
  --transfer:#9AA3D6; --transfer-bg:rgba(154,163,214,.14);
  --warn:#FFC24B; --warn-bg:rgba(255,194,75,.14);
  --hero-a:#2A1F9E; --hero-b:#5B33C9; --hero-c:#14A99D;
  --shadow-1:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-2:0 1px 0 rgba(255,255,255,.08) inset,0 30px 60px -24px rgba(0,0,0,.75);
  --aurora-1:rgba(139,124,255,.22); --aurora-2:rgba(46,230,214,.12); --aurora-3:rgba(255,138,92,.07);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1230; --bg-2:#121942;
  --surface:rgba(30,38,92,.55); --surface-solid:#171E4E; --surface-2:#1C245A;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
  --text:#EEF1FF; --muted:#A1A9D0; --faint:#6E77A6;
  --accent:#8B7CFF; --accent-2:#2EE6D6; --accent-ink:#0D1230;
  --income:#3BE0A0; --income-bg:rgba(59,224,160,.13);
  --expense:#FF8A5C; --expense-bg:rgba(255,138,92,.14);
  --transfer:#9AA3D6; --transfer-bg:rgba(154,163,214,.14);
  --warn:#FFC24B; --warn-bg:rgba(255,194,75,.14);
  --hero-a:#2A1F9E; --hero-b:#5B33C9; --hero-c:#14A99D;
  --shadow-1:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-2:0 1px 0 rgba(255,255,255,.08) inset,0 30px 60px -24px rgba(0,0,0,.75);
  --aurora-1:rgba(139,124,255,.22); --aurora-2:rgba(46,230,214,.12); --aurora-3:rgba(255,138,92,.07);
  color-scheme:dark;
}
/* ================= BASE ================= */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(60vmax 40vmax at 100% -10%,var(--aurora-1),transparent 60%),
   radial-gradient(50vmax 40vmax at -10% 30%,var(--aurora-2),transparent 60%),
   radial-gradient(40vmax 30vmax at 70% 110%,var(--aurora-3),transparent 60%),
   linear-gradient(180deg,var(--bg),var(--bg-2));}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
img,svg{max-width:100%}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.inc{color:var(--income)} .exp{color:var(--expense)} .trf{color:var(--transfer)}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:18px;height:18px} .ico.lg{width:26px;height:26px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ================= SHELL ================= */
#app{min-height:100%}
.main{max-width:640px;margin:0 auto;padding:12px 16px 132px}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 0 14px}
.topbar h1{font-size:22px;font-weight:600;margin:0;line-height:1.2;flex:1;min-width:0}
.topbar .sub{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:2px}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);transition:transform .15s}
.iconbtn:active{transform:scale(.93)}
.backbtn .ico{transform:scaleX(-1)}
.view{animation:viewIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view.push{animation:pushIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pushIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}

/* bottom nav */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:40;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.nav-inner{pointer-events:auto;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:68px;border-radius:24px;background:var(--surface);border:1px solid var(--line);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:var(--shadow-2)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--faint);text-decoration:none;padding:6px 0;transition:color .2s}
.nav a.on{color:var(--text)}
.nav a.on .ico{stroke:var(--accent)}
.fab{justify-self:center;width:60px;height:60px;border-radius:22px;margin-top:-30px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 12px 28px -8px var(--accent),0 0 0 6px var(--bg);transition:transform .18s}
.fab:active{transform:scale(.92) rotate(90deg)}
.fab .ico{width:28px;height:28px;stroke-width:2.4}

@media (min-width:960px){
  .nav{inset-inline:auto;right:0;top:0;bottom:0;width:104px;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
  .nav-inner{height:100%;grid-template-columns:1fr;grid-template-rows:auto repeat(4,auto) 1fr;align-content:start;gap:10px;padding:18px 0;border-radius:28px}
  .nav .fab{order:-1;margin:0 0 14px}
  .main{max-width:1040px;padding:28px 140px 60px 40px}
  .home-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:18px;align-items:start}
}

/* ================= CARDS ================= */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow-1);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);margin-bottom:14px}
.card.flat{box-shadow:none}
.card h2,.sec-title{font-size:15px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec-title{margin:22px 4px 10px}
.card h2 .spacer,.sec-title .spacer{flex:1}
.link{color:var(--accent);font-size:13.5px;font-weight:500}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:30px;padding:22px 20px 18px;color:#fff;margin-bottom:14px;
  background:radial-gradient(120% 90% at 0% 0%,var(--hero-c) 0%,transparent 55%),linear-gradient(150deg,var(--hero-a),var(--hero-b));
  box-shadow:var(--shadow-2)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 85% 0%,rgba(255,255,255,.18),transparent 60%);pointer-events:none}
.hero-top{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;opacity:.86;position:relative;z-index:1}
.hero-body{display:flex;align-items:center;gap:18px;margin-top:10px;position:relative;z-index:1}
.gauge{width:148px;height:148px;flex:none;position:relative}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg) scaleY(-1)}
.gauge .track{stroke:rgba(255,255,255,.16)}
.gauge .fill{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1),stroke .4s}
.gauge-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.gauge-center small{display:block;font-size:11.5px;opacity:.8}
.gauge-center b{font-family:var(--font-num);font-size:15px;font-weight:600}
.hero-num{min-width:0}
.hero-num .lbl{font-size:14px;opacity:.85}
.hero-num .big{font-family:var(--font-num);font-weight:600;font-size:clamp(40px,12vw,56px);line-height:1.02;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.hero-num .big .cur{font-size:.5em;font-weight:500;opacity:.8;margin-inline-start:4px;vertical-align:.45em}
.hero-num .meta{font-size:13px;opacity:.85;margin-top:6px;line-height:1.45}
.hero.neg .big{color:#FFD2C2}
.hero-foot{position:relative;z-index:1;display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.14);font-size:12.5px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pill .ico{width:15px;height:15px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);text-align:start}
.stat small{display:block;font-size:12px;color:var(--muted)}
.stat b{display:block;font-family:var(--font-num);font-weight:600;font-size:18px;margin-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* list items */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-radius:14px;text-align:start;width:100%;transition:background .15s}
.item:active{background:var(--surface-2)}
.item+.item{border-top:1px solid var(--line)}
.badge{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.badge .ico{width:21px;height:21px}
.item .t{font-weight:500;font-size:15px}
.item .s{font-size:12.5px;color:var(--muted)}
.amt{font-family:var(--font-num);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15.5px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font-weight:500}
.tag.proj{background:var(--transfer-bg);color:var(--transfer)}
.daygrp{font-size:12.5px;color:var(--muted);padding:14px 4px 4px;font-weight:500}

/* tabs / segments / chips */
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-size:14px;font-weight:500;color:var(--muted);transition:all .2s}
.seg button.on{background:var(--surface-solid);color:var(--text);box-shadow:0 2px 8px -3px rgba(0,0,0,.25)}
.seg button.on[data-k="expense"]{color:var(--expense)} .seg button.on[data-k="income"]{color:var(--income)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:13.5px;white-space:nowrap;transition:all .15s}
.chip.on{background:var(--text);color:var(--bg);border-color:transparent}
.chip .dot{width:8px;height:8px;border-radius:50%}

/* forms */
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.input,select.input,textarea.input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface-solid);font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s;appearance:none;-webkit-appearance:none}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:16px 52%,11px 52%;background-size:5px 5px;background-repeat:no-repeat;padding-left:30px}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface-solid);border:1px solid var(--line-2);margin-bottom:12px}
.switch{width:46px;height:28px;border-radius:999px;background:var(--line-2);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--accent)} .switch.on::after{transform:translateX(-18px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:16px;font-weight:600;font-size:16px;background:var(--surface-2);border:1px solid var(--line);transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--accent-2)));color:#fff;border:0;box-shadow:0 10px 24px -10px var(--accent)}
.btn.danger{color:var(--expense);background:var(--expense-bg);border:0}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-row{display:flex;gap:10px;margin-top:6px}
.btn-row .btn{flex:1}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(8,10,30,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity .25s}
.backdrop.show{opacity:1}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:61;max-height:94%;display:flex;flex-direction:column;background:var(--surface-solid);border-radius:28px 28px 0 0;box-shadow:0 -20px 60px -20px rgba(0,0,0,.45);transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.9,.25,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.show{transform:none}
.sheet-head{display:flex;align-items:center;gap:10px;padding:10px 18px 6px;position:relative}
.sheet-head::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:9px;background:var(--line-2)}
.sheet-head h3{flex:1;margin:18px 0 4px;font-size:18px;font-weight:600}
.sheet-body{padding:6px 18px 20px;overflow-y:auto;overscroll-behavior:contain}
@media (min-width:700px){
  .sheet{inset-inline:auto;left:50%;bottom:auto;top:50%;width:520px;max-height:88vh;border-radius:28px;transform:translate(-50%,-46%) scale(.97);opacity:0;transition:transform .28s cubic-bezier(.2,.9,.25,1),opacity .2s}
  .sheet.show{transform:translate(-50%,-50%);opacity:1}
  .sheet-head::before{display:none}
}

/* amount entry */
.amount-disp{text-align:center;padding:12px 0 6px}
.amount-disp .v{font-family:var(--font-num);font-size:46px;font-weight:600;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;transition:color .2s}
.amount-disp .v .cur{font-size:24px;opacity:.6;margin-inline-start:4px}
.amount-disp.expense .v{color:var(--expense)} .amount-disp.income .v{color:var(--income)} .amount-disp.transfer .v{color:var(--transfer)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px;direction:ltr}
.keypad button{height:52px;border-radius:16px;background:var(--surface-2);font-family:var(--font-num);font-size:22px;font-weight:500;transition:transform .08s,background .15s}
.keypad button:active{transform:scale(.94);background:var(--line-2)}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.catbtn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px;border-radius:16px;font-size:11.5px;line-height:1.2;text-align:center;border:1.5px solid transparent;transition:all .15s}
.catbtn .badge{width:40px;height:40px;border-radius:13px}
.catbtn.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
@media (min-width:700px){.keypad{display:none}}

/* toast */
.toasts{position:fixed;z-index:80;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--text);color:var(--bg);font-size:14.5px;box-shadow:var(--shadow-2);animation:toastIn .3s cubic-bezier(.2,.9,.3,1.3)}
.toast .ico{width:20px;height:20px}
.toast button{margin-inline-start:auto;font-weight:600;color:var(--accent-2)}
.toast.out{animation:toastOut .25s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}

/* empty */
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty svg.ill{width:120px;height:96px;margin:0 auto 8px;display:block}
.empty b{display:block;color:var(--text);font-weight:600;margin-bottom:4px}
.empty .btn{margin-top:12px}

/* progress / budgets */
.bar{height:8px;border-radius:9px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
/* goals */
.goal{display:flex;align-items:center;gap:14px}
.ring{width:84px;height:84px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg) scaleY(-1)}
.ring .fill{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-num);font-weight:600;font-size:17px}
/* charts */
.chart{width:100%;height:auto;display:block}
.chart .barr{transition:height .8s cubic-bezier(.2,.8,.2,1),y .8s cubic-bezier(.2,.8,.2,1)}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{width:136px;height:136px;flex:none}
.donut circle{transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1),opacity .2s;cursor:pointer}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.legend button{display:flex;align-items:center;gap:8px;text-align:start;width:100%;padding:3px 4px;border-radius:8px}
.legend button.dim{opacity:.4}
.legend i{width:10px;height:10px;border-radius:4px;flex:none}

/* banners */
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;margin-bottom:12px;background:var(--warn-bg);color:var(--text);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner .ico{color:var(--warn)}
.banner.info{background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.banner.info .ico{color:var(--accent)}
.banner .btn{padding:8px 12px;font-size:13.5px;border-radius:12px}
/* insights carousel */
.insights{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px 14px;padding:0 16px}
.insights::-webkit-scrollbar{display:none}
.insight{scroll-snap-align:start;flex:0 0 82%;max-width:340px;padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45}
.insight .badge{width:36px;height:36px;border-radius:12px}

/* more menu */
.menu .item{padding:13px 6px}
.menu .item .chev{color:var(--faint)}
.menu .item .chev .ico{transform:scaleX(-1)}

/* onboarding */
.ob{max-width:560px;margin:0 auto;padding:18px 18px 120px;min-height:100vh}
.ob-prog{display:flex;gap:5px;margin:6px 0 22px}
.ob-prog i{flex:1;height:4px;border-radius:4px;background:var(--line-2);transition:background .3s}
.ob-prog i.on{background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.ob h2{font-size:28px;line-height:1.2;font-weight:600;margin:6px 0 8px;letter-spacing:-.01em}
.ob p.lead{color:var(--muted);margin:0 0 20px;font-size:15.5px;max-width:46ch}
.ob-foot{position:fixed;bottom:0;inset-inline:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,var(--bg) 35%);z-index:5}
.ob-foot .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.ob-foot .btn{flex:1}
.ob-row{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px;position:relative}
.ob-row .x{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.ob-row .field{margin-bottom:8px}
.ob-row .field:last-child{margin-bottom:0}
.ob-hero{width:100%;max-width:300px;margin:10px auto 18px;display:block}
.addrow{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:16px;border:1.5px dashed var(--line-2);color:var(--accent);font-weight:500}

/* ai chat */
.chat{display:flex;flex-direction:column;gap:10px;min-height:240px;padding-bottom:8px}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-start;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.msg.a{align-self:flex-end;background:var(--surface-2);border-bottom-left-radius:6px}
.msg.act{align-self:center;font-size:12.5px;padding:6px 12px;background:var(--income-bg);color:var(--income);border-radius:999px}
.chat-input{display:flex;gap:8px;position:sticky;bottom:0;background:var(--surface-solid);padding-top:8px}
.chat-input .input{flex:1}
.chat-input .btn{padding:0 16px}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin:0 2px;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.suggest{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

  today() { return U.fmt(new Date()); },

  dim(y, m) { return new Date(y, m + 1, 0).getDate(); },
  clampDate(y, m, day) { const n = new Date(y, m, 1); return U.fmt(new Date(n.getFullYear(), n.getMonth(), Math.min(day, U.dim(n.getFullYear(), n.getMonth())))); },
  diff(a, b) { return Math.round((U.parse(b) - U.parse(a)) / 864e5); },
  addMonths(s, n) { const d = U.parse(s); return U.clampDate(d.getFullYear(), d.getMonth() + n, d.getDate()); },
  max: (a, b) => (a > b ? a : b), min: (a, b) => (a < b ? a : b),
  money(n, opts = {}) {

    ["accounts", "transactions", "recurring", "installments", "goals", "categories"].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });

  },
  validate(s) {
    return s && typeof s === "object" && Array.isArray(s.accounts) && Array.isArray(s.transactions) && s.settings;
  },
};

/* ---------------- Store: local-first, cloud mirror ---------------- */
const Store = {
  KEY: "yomi.state.v1", SNAP: "yomi.snapshots.v1",
  state: null, listeners: [], cloud: null, cloudStatus: "local", _pushT: null,
  load() {
    let raw = null;
    try { raw = localStorage.getItem(Store.KEY); } catch (e) {}
    try { Store.state = Model.migrate(raw ? JSON.parse(raw) : null); } catch (e) { Store.state = Model.empty(); }
    return Store.state;
  },
  save(opts = {}) {
    const s = Store.state;
    s.meta.updatedAt = Date.now();
    try { localStorage.setItem(Store.KEY, JSON.stringify(s)); } catch (e) {}
    Store.autoSnapshot();
    if (!opts.silent) Store.listeners.forEach(f => f());
    Store.schedulePush();
  },
  replace(newState) {
    Store.state = Model.migrate(newState);
    Store.save();
  },
  on(f) { Store.listeners.push(f); },
  /* גיבויים אוטומטיים: צילום אחד ליום, 7 אחרונים, במכשיר */
  snapshots() { try { return JSON.parse(localStorage.getItem(Store.SNAP) || "[]"); } catch (e) { return []; } },
  autoSnapshot() {
    try {
      const list = Store.snapshots(); const d = U.today();
      if (list[0] && list[0].date === d) { list[0].data = Store.state; list[0].at = Date.now(); }
      else list.unshift({ date: d, at: Date.now(), data: Store.state });
      localStorage.setItem(Store.SNAP, JSON.stringify(list.slice(0, 7)));
    } catch (e) {}
  },
  /* ---- Cloud (claude.ai runtime db, private per user) ---- */
  CHUNK: 180000,
  async initCloud() {
    if (!window.claude || !window.claude.use) return;
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id(); if (!id) return;
      Store.cloud = { db, base: "data/users/" + id };
      Store.cloudStatus = "syncing"; Store.listeners.forEach(f => f());
      const metaSnap = await db.doc(Store.cloud.base + "/meta").get();
      const local = Store.state;
      if (metaSnap.exists) {
        const meta = metaSnap.data();
        if ((meta.updatedAt || 0) > (local.meta.updatedAt || 0)) {
          const parts = [];
          for (let i = 0; i < meta.chunks; i++) {
            const c = await db.doc(Store.cloud.base + "/chunk_" + i).get();
            parts.push(c.exists ? c.data().s : "");
          }
          const remote = JSON.parse(parts.join(""));
          if (Model.validate(remote)) {
            Store.state = Model.migrate(remote);
            try { localStorage.setItem(Store.KEY, JSON.stringify(Store.state)); } catch (e) {}
            Store.cloudStatus = "synced"; Store.listeners.forEach(f => f());
            UI && UI.toast("הנתונים נטענו מהענן", "cloud");
            return;
          }
        } else if ((meta.updatedAt || 0) < (local.meta.updatedAt || 0)) { await Store.push(); }
      } else if (local.meta.onboarded) { await Store.push(); }
      Store.cloudStatus = "synced"; Store.listeners.forEach(f => f());
    } catch (e) { Store.cloud = null; Store.cloudStatus = "local"; }
  },
  schedulePush() {
    if (!Store.cloud) return;
    clearTimeout(Store._pushT);
    Store._pushT = setTimeout(() => Store.push(), 1800);
  },
  _pushing: null, _lastChunks: [],
  async push() {
    if (!Store.cloud) return;
    if (Store._pushing) { await Store._pushing; }
    const run = (async () => {
      try {
        Store.cloudStatus = "syncing";
        const json = JSON.stringify(Store.state);
        const chunks = [];
        for (let i = 0; i < json.length; i += Store.CHUNK) chunks.push(json.slice(i, i + Store.CHUNK));
        for (let i = 0; i < chunks.length; i++) {
          if (Store._lastChunks[i] === chunks[i]) continue;
          await Store.cloud.db.doc(Store.cloud.base + "/chunk_" + i).set({ s: chunks[i] });
        }
        await Store.cloud.db.doc(Store.cloud.base + "/meta").set({ updatedAt: Store.state.meta.updatedAt, chunks: chunks.length, v: Model.VERSION });
        Store._lastChunks = chunks;
        Store.cloudStatus = "synced";
      } catch (e) { Store.cloudStatus = "error"; }
      Store._pushing = null;
    })();
    Store._pushing = run; return run;
  },
};

/* ---------------- Engine ---------------- */
const Engine = {
  get s() { return Store.state; },

  /* ---- חודש פיננסי: מתחיל ביום המשכורת ---- */
  period(dateStr = U.today(), payday = Engine.s.settings.payday || 1) {
    const d = U.parse(dateStr); let y = d.getFullYear(), m = d.getMonth();
    let start = U.clampDate(y, m, payday);
    if (dateStr < start) start = U.clampDate(y, m - 1, payday);
    const sd = U.parse(start);
    const next = U.clampDate(sd.getFullYear(), sd.getMonth() + 1, payday);
    return { start, end: U.add(next, -1), next, key: start, days: U.diff(start, next) };
  },
  prevPeriod(p) { return Engine.period(U.add(p.start, -1)); },
  periodLabel(p) { return `${U.short(p.start)} – ${U.short(p.end)}`; },

  /* ---- מופעים חודשיים של כלל ---- */
  monthlyDates(day, from, to) {
    const out = []; if (from > to) return out;
    const a = U.parse(from); let y = a.getFullYear(), m = a.getMonth() - 1;
    for (let guard = 0; guard < 600; guard++) {
      const ds = U.clampDate(y, m, day);
      if (ds > to) break;
      if (ds >= from) out.push(ds);
      m++;
    }
    return out;
  },

  /* ---- כל הכללים המתוזמנים (משכורת, הוראות קבע, תשלומים, חיסכון, חיוב אשראי) ---- */
  rules() {
    const s = Engine.s, out = [];
    const sal = s.settings.salary;
    if (sal && sal.active !== false && sal.amount > 0) out.push({
      key: "salary", kind: "salary", day: s.settings.payday, startDate: sal.startDate || "2000-01-01", endDate: null,
      make: date => ({ type: "income", amount: Engine.salaryFor(Engine.period(date).key), accountId: sal.accountId, categoryId: sal.categoryId || "ci1", note: "משכורת" }),
    });
    s.recurring.filter(r => r.active !== false).forEach(r => out.push({
      key: "recurring:" + r.id, kind: "recurring", refId: r.id, day: r.day, startDate: r.startDate, endDate: r.endDate || null,
      make: () => ({ type: r.type, amount: r.amount, accountId: r.accountId, categoryId: r.categoryId, note: r.name }),
    }));
    s.installments.forEach(i => {
      const per = Math.round(i.total / i.count * 100) / 100;
      out.push({
        key: "installment:" + i.id, kind: "installment", refId: i.id, day: i.day, startDate: i.startDate, endDate: null, count: i.count,
        make: (date, idx) => ({ type: "expense", amount: idx === i.count ? Math.round((i.total - per * (i.count - 1)) * 100) / 100 : per, accountId: i.accountId, categoryId: i.categoryId, note: `${i.name} · תשלום ${idx} מתוך ${i.count}` }),
      });
    });
    s.goals.filter(g => !g.archived && g.monthly > 0 && g.fromAccountId).forEach(g => out.push({
      key: "goal:" + g.id, kind: "goal", refId: g.id, day: g.day || s.settings.payday, startDate: g.startDate, endDate: null,
      make: () => ({ type: "transfer", amount: g.monthly, accountId: g.fromAccountId, toAccountId: null, goalId: g.id, goalDir: "in", note: "הפקדה ל" + g.name }),
    }));
    s.accounts.filter(a => a.type === "credit" && !a.archived && a.billingDay && a.billingAccountId).forEach(a => out.push({
      key: "credit:" + a.id, kind: "credit", refId: a.id, day: a.billingDay, startDate: a.createdAt || "2000-01-01", endDate: null,
      make: date => {
        const owed = -Engine.balance(a.id, U.add(date, -1));
        return owed > 0.009 ? { type: "transfer", amount: Math.round(owed * 100) / 100, accountId: a.billingAccountId, toAccountId: a.id, note: "חיוב " + a.name } : null;
      },
    }));
    return out;
  },
  occurrences(rule, from, to) {
    const f = U.max(from, rule.startDate || from), t = rule.endDate ? U.min(to, rule.endDate) : to;
    let dates = Engine.monthlyDates(rule.day, f, t);
    if (rule.count) {
      dates = dates.map(d => ({ d, idx: Engine.monthlyDates(rule.day, rule.startDate, d).length })).filter(o => o.idx <= rule.count);
      return dates;
    }
    return dates.map(d => ({ d, idx: 0 }));
  },
  salaryFor(periodKey) {
    const s = Engine.s; const o = s.settings.salaryOverrides || {};
    return o[periodKey] != null ? o[periodKey] : (s.settings.salary ? s.settings.salary.amount : 0);
  },

  /* ---- יצירת פעולה ---- */
  tx(p) {
    return Object.assign({
      id: U.uid(), type: "expense", amount: 0, date: U.today(), accountId: null, toAccountId: null, categoryId: null,
      note: "", status: "done", planned: false, historic: false, goalId: null, goalDir: null, source: null, createdAt: Date.now(),
    }, p);
  },

  /* ---- ביצוע אוטומטי של מה שהגיע זמנו ---- */
  processDue(upTo = U.today()) {
    const s = Engine.s; let created = 0;
    const keys = new Set(s.transactions.map(t => t.source && t.source.key).filter(Boolean));
    Engine.rules().forEach(rule => {
      const last = s.runs[rule.key];
      const from = last ? U.add(last, 1) : rule.startDate;
      if (!from || from > upTo) return;
      Engine.occurrences(rule, from, upTo).forEach(({ d, idx }) => {
        const key = rule.key + ":" + d; if (keys.has(key)) return;
        const body = rule.make(d, idx); if (!body) return;
        s.transactions.push(Engine.tx(Object.assign(body, { date: d, status: "done", source: { kind: rule.kind, refId: rule.refId || null, key } })));
        keys.add(key); created++;
      });
      s.runs[rule.key] = upTo;
    });
    return created;
  },
  /* מופעים שקרו מתחילת החודש הפיננסי ועד אתמול — נרשמים לחישוב בלבד (כבר משתקפים ביתרה שהוזנה) */
  backfillHistoric(ruleKeyFilter) {
    const s = Engine.s, p = Engine.period(), y = U.add(U.today(), -1);
    const keys = new Set(s.transactions.map(t => t.source && t.source.key).filter(Boolean));
    Engine.rules().filter(r => !ruleKeyFilter || ruleKeyFilter(r)).forEach(rule => {
      if (rule.kind === "credit") { s.runs[rule.key] = y; return; }
      Engine.occurrences(Object.assign({}, rule, { startDate: p.start }), p.start, y).forEach(({ d, idx }) => {
        const key = rule.key + ":" + d; if (keys.has(key)) return;
        const body = rule.make(d, idx); if (!body) return;
        s.transactions.push(Engine.tx(Object.assign(body, { date: d, status: "done", historic: true, source: { kind: rule.kind, refId: rule.refId || null, key } })));
        keys.add(key);
      });
      s.runs[rule.key] = U.max(s.runs[rule.key] || "", y);
    });
  },
  /* תחזית: מה עוד צפוי לקרות בטווח (לא נשמר) */
  projected(from, to) {
    const s = Engine.s, out = [];
    const keys = new Set(s.transactions.map(t => t.source && t.source.key).filter(Boolean));
    Engine.rules().forEach(rule => {
      const last = s.runs[rule.key];
      const f = U.max(from, last ? U.add(last, 1) : rule.startDate);
      Engine.occurrences(rule, f, to).forEach(({ d, idx }) => {
        const key = rule.key + ":" + d; if (keys.has(key)) return;
        let body;
        if (rule.kind === "credit") { const a = Engine.acc(rule.refId); const owed = -Engine.balance(a.id); body = owed > 0 ? { type: "transfer", amount: owed, accountId: a.billingAccountId, toAccountId: a.id, note: "חיוב " + a.name } : null; }
        else body = rule.make(d, idx);
        if (body) out.push(Engine.tx(Object.assign(body, { id: "p_" + key, date: d, status: "pending", projected: true, source: { kind: rule.kind, refId: rule.refId || null, key } })));
      });
    });
    return out.sort((a, b) => a.date.localeCompare(b.date));
  },

  /* ---- יתרות ---- */
  acc(id) { return Engine.s.accounts.find(a => a.id === id); },
  cat(id) { return Engine.s.categories.find(c => c.id === id); },
  goal(id) { return Engine.s.goals.find(g => g.id === id); },
  effect(t, accId) {
    if (t.status !== "done" || t.historic) return 0;
    const a = t.amount;
    if (t.type === "expense") return t.accountId === accId ? -a : 0;
    if (t.type === "income") return t.accountId === accId ? a : 0;
    if (t.type === "adjust") return t.accountId === accId ? a : 0;
    if (t.type === "transfer") {
      let e = 0;
      if (t.goalId) { if (t.goalDir === "in" && t.accountId === accId) e -= a; if (t.goalDir === "out" && t.toAccountId === accId) e += a; return e; }
      if (t.accountId === accId) e -= a; if (t.toAccountId === accId) e += a; return e;
    }
    return 0;
  },
  balance(accId, upTo = null) {
    const a = Engine.acc(accId); if (!a) return 0;
    return Math.round((a.opening || 0) * 100 + U.sum(Engine.s.transactions.filter(t => !upTo || t.date <= upTo), t => Engine.effect(t, accId) * 100)) / 100;
  },
  pendingFor(accId) {
    return U.sum(Engine.s.transactions.filter(t => t.status === "pending" && !t.historic && t.date <= U.today()), t => {
      const tt = Object.assign({}, t, { status: "done" }); return Engine.effect(tt, accId);
    });
  },
  goalSaved(gid) {
    const g = Engine.goal(gid); if (!g) return 0;
    return (g.initial || 0) + U.sum(Engine.s.transactions.filter(t => t.goalId === gid && t.status === "done"), t => t.goalDir === "out" ? -t.amount : t.amount);
  },
  totals() {
    const accs = Engine.s.accounts.filter(a => !a.archived);
    const liquid = U.sum(accs.filter(a => a.type !== "credit"), a => Engine.balance(a.id));
    const credit = U.sum(accs.filter(a => a.type === "credit"), a => Engine.balance(a.id));
    const savings = U.sum(Engine.s.goals.filter(g => !g.archived), g => Engine.goalSaved(g.id));
    return { liquid, credit, net: liquid + credit, savings };
  },

  /* ---- סיווג ---- */
  isPlanned(t) { return !!(t.planned || (t.source && ["recurring", "installment"].includes(t.source.kind))); },
  isSaving(t) { return t.type === "transfer" && !!t.goalId; },

  /* ---- הסכום היומי ----
     פנוי לחודש = הכנסות החודש − התחייבויות (קבועות/תשלומים/עתידיות) − הפרשות לחיסכון
     בסיס יומי = פנוי לחודש ÷ ימי החודש הפיננסי
     פנוי להיום = (פנוי לחודש − הוצאות משתנות עד אתמול) ÷ ימים שנותרו (כולל היום) − הוצאות היום   */
  stats(opts = {}) {
    const s = Engine.s, today = opts.today || U.today(), p = opts.period || Engine.period(today);
    const real = s.transactions.filter(t => t.date >= p.start && t.date <= p.end && t.type !== "adjust");
    const proj = today < p.end ? Engine.projected(U.max(p.start, U.add(today, 1)), p.end) : [];
    const all = real.concat(proj);
    const extra = opts.extra || 0; // מצב "מה אם" (v2)
    const income = U.sum(all.filter(t => t.type === "income"), t => t.amount);
    const planned = U.sum(all.filter(t => t.type === "expense" && Engine.isPlanned(t)), t => t.amount);
    const savings = U.sum(all.filter(Engine.isSaving), t => t.goalDir === "out" ? -t.amount : t.amount);
    const variable = real.filter(t => t.type === "expense" && !Engine.isPlanned(t));
    const spentBefore = U.sum(variable.filter(t => t.date < today), t => t.amount);
    const spentToday = U.sum(variable.filter(t => t.date === today), t => t.amount) + extra;
    const free = income - planned - savings;
    const daysLeft = Math.max(1, U.diff(today, p.end) + 1);
    const base = free / p.days;
    const todayBudget = (free - spentBefore) / daysLeft;
    const available = todayBudget - spentToday;
    const avgAfterToday = (free - spentBefore - spentToday) / daysLeft;
    const plannedUpcoming = all.filter(t => t.date > today && (t.type === "expense" || Engine.isSaving(t) || (t.type === "transfer" && t.source && t.source.kind === "credit")));
    const spentPeriod = U.sum(real.filter(t => t.type === "expense" && t.date <= today), t => t.amount);
    const incomePeriod = U.sum(real.filter(t => t.type === "income" && t.date <= today), t => t.amount);
    return { p, today, income, planned, savings, free, base, todayBudget, available, spentToday, spentBefore, daysLeft, avgAfterToday, plannedUpcoming, spentPeriod, incomePeriod, proj, real };
  },

  /* ---- פעולות ---- */
  addTx(t) {
    const tx = Engine.tx(t);
    if (tx.date > U.today() && !tx.source) { tx.planned = tx.type === "expense" ? true : tx.planned; if (tx.status === "done") tx.status = "pending"; }
    Engine.s.transactions.push(tx); return tx;
  },
  updateTx(id, patch) { const t = Engine.s.transactions.find(x => x.id === id); if (t) Object.assign(t, patch); return t; },
  removeTx(id) { const i = Engine.s.transactions.findIndex(x => x.id === id); return i >= 0 ? Engine.s.transactions.splice(i, 1)[0] : null; },
  dueConfirm() { const t = U.today(); return Engine.s.transactions.filter(x => x.status === "pending" && x.date <= t && !x.source).sort((a, b) => a.date.localeCompare(b.date)); },
  futureOps() { const t = U.today(); return Engine.s.transactions.filter(x => x.date > t && !x.source).sort((a, b) => a.date.localeCompare(b.date)); },

  label(t) {
    if (t.type === "transfer") {
      if (t.goalId) { const g = Engine.goal(t.goalId); return (t.goalDir === "out" ? "משיכה מ" : "הפקדה ל") + (g ? g.name : "חיסכון"); }
      const a = Engine.acc(t.accountId), b = Engine.acc(t.toAccountId);
      if (a && b && a.type === "cash" && b.type === "bank") return "הפקדה לבנק";
      if (a && b && a.type === "bank" && b.type === "cash") return "משיכת מזומן";
      return t.note || `${a ? a.name : "?"} ← ${b ? b.name : "?"}`;
    }
    if (t.type === "adjust") return "עדכון יתרה";
    const c = Engine.cat(t.categoryId);
    return t.note || (c ? c.name : t.type === "income" ? "הכנסה" : "הוצאה");
  },
};

/* ---------------- Hooks: נקודות הרחבה לגרסה 2 ---------------- */
const Hooks = { homeTop: [], homeCards: [], moreItems: [], afterTxSave: [], catFormFields: [], onBoot: [] };

/* ---------------- UI core ---------------- */
const UI = {
  route: { tab: "home", stack: [] },
  recentTab: "expense",
  app: null,
  toast(msg, icon = "check", opts = {}) {
    const box = document.getElementById("toasts");
    const el = document.createElement("div"); el.className = "toast";
    el.innerHTML = `${ico(icon)}<span>${U.esc(msg)}</span>${opts.undo ? `<button type="button">ביטול</button>` : ""}`;
    box.appendChild(el);
    const kill = () => { el.classList.add("out"); setTimeout(() => el.remove(), 260); };
    if (opts.undo) el.querySelector("button").onclick = () => { opts.undo(); kill(); };
    setTimeout(kill, opts.ms || (opts.undo ? 5000 : 2600));
    U.haptic(10);
  },
  /* ---- bottom sheet ---- */
  _sheets: [],
  sheet(title, html, opts = {}) {
    const bd = document.createElement("div"); bd.className = "backdrop";
    const sh = document.createElement("div"); sh.className = "sheet"; sh.setAttribute("role", "dialog"); sh.setAttribute("aria-modal", "true");
    sh.innerHTML = `<div class="sheet-head"><h3>${U.esc(title)}</h3><button class="iconbtn" data-close aria-label="סגירה">${ico("x", "sm")}</button></div><div class="sheet-body">${html}</div>`;
    document.body.append(bd, sh);
    const rec = { bd, sh, onClose: opts.onClose };
    UI._sheets.push(rec);
    requestAnimationFrame(() => { bd.classList.add("show"); sh.classList.add("show"); });
    const close = () => UI.closeSheet(rec);
    bd.onclick = close; sh.querySelector("[data-close]").onclick = close;
    // swipe down to close (mobile)
    let y0 = null; const head = sh.querySelector(".sheet-head");
    head.addEventListener("touchstart", e => { y0 = e.touches[0].clientY; }, { passive: true });
    head.addEventListener("touchmove", e => { if (y0 == null) return; const dy = e.touches[0].clientY - y0; if (dy > 0) sh.style.transform = `translateY(${dy}px)`; }, { passive: true });
    head.addEventListener("touchend", e => { const dy = (e.changedTouches[0].clientY - (y0 || 0)); sh.style.transform = ""; y0 = null; if (dy > 90) close(); });
    if (opts.mount) opts.mount(sh.querySelector(".sheet-body"), close);
    setTimeout(() => { const f = sh.querySelector("[autofocus]"); if (f && window.innerWidth > 700) f.focus(); }, 350);
    rec._hist = UI.hpush();
    return { el: sh, body: sh.querySelector(".sheet-body"), close };
  },
  closeSheet(rec, fromPop) {
    if (!rec || rec.closed) return; rec.closed = true;
    rec.bd.classList.remove("show"); rec.sh.classList.remove("show");
    setTimeout(() => { rec.bd.remove(); rec.sh.remove(); }, 340);
    UI._sheets = UI._sheets.filter(r => r !== rec);
    if (rec.onClose) rec.onClose();
    if (!fromPop && rec._hist) { UI._ignorePop = true; history.back(); }
  },
  closeAll() { [...UI._sheets].forEach(r => UI.closeSheet(r)); },
  confirm(title, text, okLabel = "אישור", danger = false) {
    return new Promise(res => {
      let done = false;
      const s = UI.sheet(title, `<p class="muted" style="margin:0 0 16px">${U.esc(text)}</p><div class="btn-row"><button class="btn" data-no>ביטול</button><button class="btn ${danger ? "danger" : "primary"}" data-ok>${U.esc(okLabel)}</button></div>`,
        { onClose: () => { if (!done) res(false); } });
      s.body.querySelector("[data-ok]").onclick = () => { done = true; res(true); s.close(); };
      s.body.querySelector("[data-no]").onclick = () => { done = true; res(false); s.close(); };
    });
  },

  /* ---- router ---- */
  go(tab) { UI.route = { tab, stack: [] }; UI.render(); window.scrollTo({ top: 0 }); },
  hpush() { try { history.pushState({ yomi: 1 }, ""); return true; } catch (e) { return false; } },
  push(view, params = {}) { UI.route.stack.push({ view, params, h: UI.hpush() }); UI.render(true); window.scrollTo({ top: 0 }); },
  back() { const top = UI.route.stack[UI.route.stack.length - 1]; if (!top) return; if (top.h) { history.back(); } else { UI.route.stack.pop(); UI.render(); } },
  onPop() {
    if (UI._ignorePop) { UI._ignorePop = false; return; }
    const sh = UI._sheets[UI._sheets.length - 1];
    if (sh) { sh._hist = false; UI.closeSheet(sh, true); return; }
    if (UI.route.stack.length) { UI.route.stack.pop(); UI.render(); }
  },
  render(isPush) {
    const s = Store.state;
    document.documentElement.dataset.theme = s.settings.theme === "auto" ? "" : s.settings.theme;
    if (!document.documentElement.dataset.theme) delete document.documentElement.dataset.theme;
    if (!s.meta.onboarded) { UI.app.innerHTML = Onboarding.render(); Onboarding.after(); return; }
    const top = UI.route.stack[UI.route.stack.length - 1];
    const html = top ? Views[top.view](top.params) : Views[UI.route.tab]();
    UI.app.innerHTML = `<main class="main"><div class="view ${isPush ? "push" : ""}">${html}</div></main>${UI.nav()}`;
    UI.after();
  },
  refresh() { if (!Store.state.meta.onboarded) return UI.render(); const y = window.scrollY; UI.render(); window.scrollTo({ top: y }); },
  nav() {
    const t = UI.route.tab, it = (k, icon, label) => `<a href="#" data-act="tab" data-tab="${k}" class="${t === k ? "on" : ""}" aria-label="${label}">${ico(icon)}<span>${label}</span></a>`;
    return `<nav class="nav" aria-label="ניווט ראשי"><div class="nav-inner">${it("home", "home", "בית")}${it("activity", "list", "פעולות")}<button class="fab" data-act="add" aria-label="הוספת פעולה">${ico("plus")}</button>${it("goals", "target", "חיסכון")}${it("more", "dots", "עוד")}</div></nav>`;
  },
  topbar(title, sub = "", right = "", back = false) {
    return `<header class="topbar">${back ? `<button class="iconbtn backbtn" data-act="back" aria-label="חזרה">${ico("chev")}</button>` : ""}<h1>${title}${sub ? `<span class="sub">${sub}</span>` : ""}</h1>${right}</header>`;
  },
  after() {
    // count-up numbers
    document.querySelectorAll("[data-count]").forEach(el => UI.countUp(el, Number(el.dataset.count), el.dataset.from != null ? Number(el.dataset.from) : null));
    // fill bars, rings, donuts
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.querySelectorAll("[data-w]").forEach(el => { el.style.width = el.dataset.w; });
      document.querySelectorAll("[data-off]").forEach(el => { el.style.strokeDashoffset = el.dataset.off; });
      document.querySelectorAll("[data-dash]").forEach(el => { el.style.strokeDasharray = el.dataset.dash; });
    }));
  },
  _counts: {},
  countUp(el, to, from) {
    const key = el.dataset.key || ""; const start = from != null ? from : (UI._counts[key] != null ? UI._counts[key] : 0);
    UI._counts[key] = to;
    const fmt = v => el.dataset.plain ? Math.round(v).toLocaleString("he-IL") : U.money(v, { round: true });
    if (matchMedia("(prefers-reduced-motion: reduce)").matches || start === to) { el.textContent = fmt(to); return; }
    const t0 = performance.now(), dur = 900;
    const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(start + (to - start) * e); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  },

  /* ---- shared fragments ---- */
  badge(icon, color) { return `<span class="badge" style="background:${color}22;color:${color}">${ico(icon)}</span>`; },
  txBadge(t) {
    if (t.type === "transfer") { if (t.goalId) { const g = Engine.goal(t.goalId); return UI.badge(g ? g.icon || "target" : "target", g ? g.color : "#7C6CFF"); } return `<span class="badge" style="background:var(--transfer-bg);color:var(--transfer)">${ico("swap")}</span>`; }
    if (t.type === "adjust") return `<span class="badge" style="background:var(--transfer-bg);color:var(--transfer)">${ico("sliders")}</span>`;
    const c = Engine.cat(t.categoryId); return UI.badge(c ? c.icon : t.type === "income" ? "coins" : "dots", c ? c.color : "#8A94B8");
  },
  txItem(t, opts = {}) {
    const a = Engine.acc(t.accountId), b = Engine.acc(t.toAccountId);
    const cls = t.type === "income" ? "inc" : t.type === "expense" ? "exp" : "trf";
    const sign = t.type === "income" ? "+" : t.type === "expense" ? "-" : "";
    let sub = t.type === "transfer" ? `${a ? a.name : t.goalDir === "out" ? "חיסכון" : ""}${b ? " ← " + b.name : t.goalId && t.goalDir === "in" ? " ← חיסכון" : ""}` : (a ? a.name : "");
    if (opts.date) sub = U.short(t.date) + (sub ? " · " + sub : "");
    const tags = (t.status === "pending" ? `<span class="tag">${ico("hourglass", "sm")}ממתין</span>` : "") + (t.projected ? `<span class="tag proj">צפוי</span>` : "");
    const amt = t.type === "adjust" ? U.money(t.amount, { sign: true }) : "\u2066" + sign + U.money(t.amount).replace(/[-\u2066\u2069]/g, "") + "\u2069";
    return `<button class="item" ${t.projected ? "" : `data-act="editTx" data-id="${t.id}"`}>${UI.txBadge(t)}<span class="grow"><span class="t ellip" style="display:block">${U.esc(Engine.label(t))}</span><span class="s ellip" style="display:block">${U.esc(sub)} ${tags}</span></span><span class="amt ${cls}">${amt}</span></button>`;
  },
  empty(title, text, btn = "") {
    return `<div class="empty"><svg class="ill" viewBox="0 0 120 96" aria-hidden="true"><defs><linearGradient id="eg" x1="0" x2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-2)"/></linearGradient></defs><ellipse cx="60" cy="86" rx="40" ry="5" fill="var(--line-2)"/><rect x="28" y="22" width="64" height="52" rx="14" fill="var(--surface-2)" stroke="var(--line-2)"/><rect x="38" y="34" width="30" height="6" rx="3" fill="url(#eg)" opacity=".8"/><rect x="38" y="46" width="44" height="5" rx="2.5" fill="var(--line-2)"/><rect x="38" y="56" width="22" height="5" rx="2.5" fill="var(--line-2)"/><circle cx="90" cy="24" r="12" fill="url(#eg)"/><path d="M85 24h10M90 19v10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg><b>${title}</b>${text}${btn}</div>`;
  },
  ring(pct, color, size = 84, stroke = 9, label = "") {
    const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(1, pct)));
    return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/><circle class="fill" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${off}"/></svg><b>${label}</b></div>`;
  },
  bar(pct, color) { return `<div class="bar"><i style="background:${color}" data-w="${Math.max(0, Math.min(100, pct * 100)).toFixed(1)}%"></i></div>`; },
  donut(items, key) {
    const total = U.sum(items, i => i.v); if (!total) return "";
    const r = 54, c = 2 * Math.PI * r; let acc = 0;
    const segs = items.map((it, i) => { const len = c * it.v / total; const gap = items.length > 1 ? 2 : 0; const s = `<circle data-seg="${i}" data-act="donutSeg" data-key="${key}" cx="68" cy="68" r="${r}" fill="none" stroke="${it.color}" stroke-width="18" stroke-dasharray="0 ${c}" data-dash="${Math.max(0, len - gap)} ${c - Math.max(0, len - gap)}" stroke-dashoffset="${-acc}" transform="rotate(-90 68 68)"/>`; acc += len; return s; }).join("");
    const legend = items.slice(0, 7).map((it, i) => `<button data-act="donutSeg" data-key="${key}" data-seg="${i}"><i style="background:${it.color}"></i><span class="grow ellip">${U.esc(it.l)}</span><span class="num">${Math.round(it.v / total * 100)}%</span></button>`).join("");
    return `<div class="donut-wrap"><svg class="donut" viewBox="0 0 136 136" role="img" aria-label="התפלגות הוצאות">${segs}<text x="68" y="64" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--font-ui)">סה״כ</text><text x="68" y="82" text-anchor="middle" font-size="16" font-weight="600" fill="var(--text)" font-family="var(--font-num)">${U.money(total, { round: true })}</text></svg><div class="legend" id="legend-${key}">${legend}</div></div>`;
  },
  dailyBars(p, st) {
    const days = p.days, vals = [], today = U.today();
    for (let i = 0; i < days; i++) { const d = U.add(p.start, i); vals.push({ d, v: U.sum(Store.state.transactions.filter(t => t.date === d && t.type === "expense" && !Engine.isPlanned(t)), t => t.amount) }); }
    const max = Math.max(1, st ? st.base * 1.6 : 0, ...vals.map(v => v.v)); const W = 300, H = 110, bw = W / days;
    const baseY = st && st.base > 0 ? H - (st.base / max) * (H - 10) : null;
    const bars = vals.map((o, i) => { const h = Math.max(o.v ? 3 : 1.5, (o.v / max) * (H - 10)); const over = st && o.v > st.base; return `<rect class="barr" x="${W - (i + 1) * bw + bw * .18}" y="${H - h}" width="${bw * .64}" height="${h}" rx="${Math.min(3, bw * .3)}" fill="${o.d === today ? "var(--accent)" : over ? "var(--expense)" : "var(--accent-2)"}" opacity="${o.d > today ? .18 : o.d === today ? 1 : .75}"><title>${U.short(o.d)}: ${U.money(o.v)}</title></rect>`; }).join("");
    return `<svg class="chart" viewBox="0 0 ${W} ${H + 16}" role="img" aria-label="הוצאות משתנות לפי יום">${bars}${baseY != null ? `<line x1="0" x2="${W}" y1="${baseY}" y2="${baseY}" stroke="var(--muted)" stroke-dasharray="3 4" stroke-width="1"/><text direction="rtl" x="${W}" y="${baseY - 4}" text-anchor="start" font-size="9" fill="var(--muted)" font-family="var(--font-ui)">בסיס יומי ${U.money(st.base, { round: true })}</text>` : ""}<text direction="rtl" x="${W}" y="${H + 13}" font-size="9" fill="var(--faint)" text-anchor="start" font-family="var(--font-ui)">${U.short(p.start)}</text><text direction="rtl" x="0" y="${H + 13}" text-anchor="end" font-size="9" fill="var(--faint)" font-family="var(--font-ui)">${U.short(p.end)}</text></svg>`;
  },
};

/* ---------------- Generic form sheet ---------------- */
const Form = {
  accOptions(filter = () => true, withNone = false) {
    const o = Store.state.accounts.filter(a => !a.archived && filter(a)).map(a => ({ v: a.id, l: `${a.name} · ${ACCOUNT_TYPES[a.type].label}` }));
    return withNone ? [{ v: "", l: "—" }].concat(o) : o;
  },
  catOptions(kind) { return Store.state.categories.filter(c => c.kind === kind).map(c => ({ v: c.id, l: c.name })); },
  dayOptions() { return Array.from({ length: 31 }, (_, i) => ({ v: i + 1, l: String(i + 1) })); },
  field(f, v) {
    const val = v != null ? v : (f.value != null ? f.value : "");
    const lab = `<span>${U.esc(f.label)}${f.hint ? ` <span class="faint">· ${U.esc(f.hint)}</span>` : ""}</span>`;
    switch (f.type) {
      case "amount": return `<label class="field">${lab}<input class="input num" name="${f.name}" inputmode="decimal" placeholder="₪0" value="${val === "" ? "" : U.esc(val)}" ${f.autofocus ? "autofocus" : ""}></label>`;
      case "number": return `<label class="field">${lab}<input class="input num" name="${f.name}" type="number" inputmode="numeric" min="${f.min ?? ""}" max="${f.max ?? ""}" value="${U.esc(val)}"></label>`;
      case "date": return `<label class="field">${lab}<input class="input" type="date" name="${f.name}" value="${U.esc(val)}"></label>`;
      case "time": return `<label class="field">${lab}<input class="input" type="time" name="${f.name}" value="${U.esc(val)}"></label>`;
      case "select": return `<label class="field">${lab}<select class="input" name="${f.name}">${f.options.map(o => `<option value="${U.esc(o.v)}" ${String(o.v) === String(val) ? "selected" : ""}>${U.esc(o.l)}</option>`).join("")}</select></label>`;
      case "toggle": return `<div class="toggle"><span>${U.esc(f.label)}${f.hint ? `<span class="faint" style="display:block;font-size:12.5px">${U.esc(f.hint)}</span>` : ""}</span><button type="button" class="switch ${val ? "on" : ""}" role="switch" aria-checked="${!!val}" data-toggle="${f.name}"></button><input type="hidden" name="${f.name}" value="${val ? "1" : ""}"></div>`;
      case "seg": return `<div class="field">${lab}<div class="seg" data-seg="${f.name}">${f.options.map(o => `<button type="button" data-k="${o.v}" class="${String(o.v) === String(val) ? "on" : ""}">${U.esc(o.l)}</button>`).join("")}</div><input type="hidden" name="${f.name}" value="${U.esc(val)}"></div>`;
      case "color": return `<div class="field">${lab}<div class="chips" data-pick="${f.name}">${PALETTE.map(c => `<button type="button" class="chip ${c === val ? "on" : ""}" data-v="${c}" style="padding:6px" aria-label="צבע"><span class="dot" style="width:18px;height:18px;background:${c}"></span></button>`).join("")}</div><input type="hidden" name="${f.name}" value="${U.esc(val)}"></div>`;
      case "icon": return `<div class="field">${lab}<div class="chips" data-pick="${f.name}">${f.options.map(i => `<button type="button" class="chip ${i === val ? "on" : ""}" data-v="${i}" style="padding:8px" aria-label="${i}">${ico(i, "sm")}</button>`).join("")}</div><input type="hidden" name="${f.name}" value="${U.esc(val)}"></div>`;
      case "note": return `<p class="faint" style="font-size:13px;margin:-2px 0 12px">${f.text}</p>`;
      default: return `<label class="field">${lab}<input class="input" name="${f.name}" value="${U.esc(val)}" placeholder="${U.esc(f.placeholder || "")}" ${f.autofocus ? "autofocus" : ""}></label>`;
    }
  },
  wire(root) {
    root.querySelectorAll("[data-toggle]").forEach(b => b.onclick = () => { const on = !b.classList.contains("on"); b.classList.toggle("on", on); b.setAttribute("aria-checked", on); root.querySelector(`input[name="${b.dataset.toggle}"]`).value = on ? "1" : ""; b.dispatchEvent(new Event("change", { bubbles: true })); });
    root.querySelectorAll("[data-seg]").forEach(g => g.querySelectorAll("button").forEach(b => b.onclick = () => { g.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); root.querySelector(`input[name="${g.dataset.seg}"]`).value = b.dataset.k; g.dispatchEvent(new Event("change", { bubbles: true })); }));
    root.querySelectorAll("[data-pick]").forEach(g => g.querySelectorAll("button").forEach(b => b.onclick = () => { g.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); root.querySelector(`input[name="${g.dataset.pick}"]`).value = b.dataset.v; }));
  },
  read(root) { const o = {}; root.querySelectorAll("[name]").forEach(i => { o[i.name] = i.value; }); return o; },
  open({ title, fields, values = {}, onSave, onDelete, saveLabel = "שמירה", deleteLabel = "מחיקה" }) {
    const html = `<form novalidate>${fields.map(f => Form.field(f, values[f.name])).join("")}<div class="btn-row">${onDelete ? `<button type="button" class="btn danger" data-del>${ico("trash", "sm")}${deleteLabel}</button>` : ""}<button class="btn primary" type="submit">${saveLabel}</button></div></form>`;
    const s = UI.sheet(title, html);
    const form = s.body.querySelector("form"); Form.wire(form);
    form.onsubmit = e => { e.preventDefault(); const v = Form.read(form); const err = onSave(v); if (err) { UI.toast(err, "alert"); return; } s.close(); };
    if (onDelete) form.querySelector("[data-del]").onclick = async () => { if (await onDelete()) s.close(); };
    return s;
  },
};

/* ---------------- Transaction sheet (הוספה מהירה + עריכה) ---------------- */
const TxSheet = {
  open(opts = {}) {
    const s = Store.state, edit = opts.tx || null;
    const st = {
      type: edit ? edit.type : opts.type || "expense",
      amount: edit ? String(edit.amount) : opts.amount ? String(opts.amount) : "",
      categoryId: edit ? edit.categoryId : opts.categoryId || null,
      accountId: edit ? edit.accountId : opts.accountId || s.settings.defaultAccountId || (s.accounts.find(a => !a.archived) || {}).id,
      toAccountId: edit ? edit.toAccountId : opts.toAccountId || null,
      date: edit ? edit.date : opts.date || U.today(),
      note: edit ? edit.note : "",
      status: edit ? edit.status : opts.status || "done",
      more: !!(edit || opts.date || opts.more),
    };
    if (st.type === "adjust" || (edit && edit.goalId)) return TxSheet.openGeneric(edit);
    if (st.type === "transfer" && !st.toAccountId) { const o = s.accounts.find(a => !a.archived && a.id !== st.accountId && a.type !== "credit"); st.toAccountId = o ? o.id : null; }
    const sh = UI.sheet(edit ? "עריכת פעולה" : opts.title || "פעולה חדשה", `<div id="txs"></div>`);
    const root = sh.body.querySelector("#txs");
    const accs = () => s.accounts.filter(a => !a.archived);
    const usage = typeof V2 !== "undefined" ? V2.catUsage() : {};
    const draw = () => {
      const cats = s.categories.filter(c => c.kind === (st.type === "income" ? "income" : "expense")).sort((x, y) => (usage[y.id] || 0) - (usage[x.id] || 0));
      const accChips = (field, filter = () => true) => `<div class="chips scroll">${accs().filter(filter).map(a => `<button type="button" class="chip ${st[field] === a.id ? "on" : ""}" data-f="${field}" data-v="${a.id}">${ico(ACCOUNT_TYPES[a.type].icon, "sm")}${U.esc(a.name)}</button>`).join("")}</div>`;
      root.innerHTML = `
        <div class="seg" style="margin-bottom:4px">${[["expense", "הוצאה"], ["income", "הכנסה"], ["transfer", "העברה"]].map(([k, l]) => `<button type="button" data-k="${k}" data-type="${k}" class="${st.type === k ? "on" : ""}">${l}</button>`).join("")}</div>
        <div class="amount-disp ${st.type}"><div class="v num" id="amtv">${st.amount ? Number(st.amount).toLocaleString("he-IL", { maximumFractionDigits: 2 }) + (st.amount.endsWith(".") ? "." : "") : "0"}<span class="cur">₪</span></div>
          <input class="input num" id="amtIn" inputmode="decimal" aria-label="סכום" value="${U.esc(st.amount)}" style="max-width:220px;margin:8px auto 0;text-align:center;display:${window.innerWidth >= 700 ? "block" : "none"}" autofocus></div>
        <div class="keypad">${["1", "2", "3", "4", "5", "6", "7", "8", "9", ".", "0", "⌫"].map(k => `<button type="button" data-key="${k}" aria-label="${k === "⌫" ? "מחיקה" : k}">${k}</button>`).join("")}</div>
        ${st.type === "transfer" ? `
          <div class="chips" style="margin-bottom:12px"><button type="button" class="chip" data-preset="deposit">${ico("arrowDown", "sm")}הפקדת מזומן לבנק</button><button type="button" class="chip" data-preset="withdraw">${ico("arrowUp", "sm")}משיכת מזומן</button></div>
          <div class="field"><span>מאיפה</span>${accChips("accountId")}</div>
          <div class="field"><span>לאן</span>${accChips("toAccountId", a => a.id !== st.accountId)}</div>`
        : `<div class="catgrid">${cats.map(c => `<button type="button" class="catbtn ${st.categoryId === c.id ? "on" : ""}" data-cat="${c.id}">${UI.badge(c.icon, c.color)}<span>${U.esc(c.name)}</span></button>`).join("")}</div>
          <div class="field"><span>${st.type === "income" ? "לאיזה חשבון נכנס" : "מאיפה יצא הכסף"}</span>${accChips("accountId")}</div>`}
        ${st.more ? `
          <div class="grid2"><label class="field"><span>תאריך</span><input class="input" type="date" id="dIn" value="${st.date}"></label>
          <div class="field"><span>סטטוס</span><div class="seg" id="stSeg"><button type="button" data-k="done" class="${st.status === "done" ? "on" : ""}">בוצע</button><button type="button" data-k="pending" class="${st.status === "pending" ? "on" : ""}">ממתין</button></div></div></div>
          <label class="field"><span>תיאור</span><input class="input" id="nIn" value="${U.esc(st.note)}" placeholder="${st.type === "income" ? "לדוגמה: בונוס" : "לדוגמה: קניות לשבוע"}"></label>`
        : `<button type="button" class="link" id="moreBtn" style="margin:0 0 14px">${ico("cal", "sm")} תאריך, סטטוס ותיאור</button>`}
        <div class="btn-row">${edit ? `<button type="button" class="btn danger" id="delBtn">${ico("trash", "sm")}מחיקה</button>` : ""}<button type="button" class="btn primary" id="saveBtn">${edit ? "שמירה" : "הוספה"}</button></div>`;
      wire();
    };
    const setAmt = v => { st.amount = v; const el = root.querySelector("#amtv"); el.innerHTML = `${v ? Number(v).toLocaleString("he-IL", { maximumFractionDigits: 2 }) + (v.endsWith(".") ? "." : "") : "0"}<span class="cur">₪</span>`; };
    const wire = () => {
      root.querySelectorAll("[data-type]").forEach(b => b.onclick = () => { st.type = b.dataset.type; st.categoryId = null; if (st.type === "transfer" && (!st.toAccountId || st.toAccountId === st.accountId)) { const o = accs().find(a => a.id !== st.accountId && a.type !== "credit"); st.toAccountId = o ? o.id : null; } draw(); });
      root.querySelectorAll("[data-key]").forEach(b => b.onclick = () => {
        let v = st.amount, k = b.dataset.key; U.haptic(5);
        if (k === "⌫") v = v.slice(0, -1); else if (k === ".") { if (!v.includes(".")) v = (v || "0") + "."; } else { if (v.includes(".") && v.split(".")[1].length >= 2) return; if (v === "0") v = ""; if (v.replace(".", "").length >= 8) return; v += k; }
        setAmt(v); const inp = root.querySelector("#amtIn"); if (inp) inp.value = v;
      });
      const inp = root.querySelector("#amtIn"); if (inp) inp.oninput = () => { const v = inp.value.replace(/[^\d.]/g, ""); setAmt(v); };
      root.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { st.categoryId = b.dataset.cat; root.querySelectorAll("[data-cat]").forEach(x => x.classList.toggle("on", x === b)); U.haptic(6); });
      root.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { st[b.dataset.f] = b.dataset.v; if (st.type === "transfer" && st.toAccountId === st.accountId) st.toAccountId = null; draw(); });
      root.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => {
        const cash = accs().find(a => a.type === "cash"), bank = accs().find(a => a.type === "bank");
        if (!cash || !bank) return UI.toast("צריך חשבון בנק וחשבון מזומן", "alert");
        if (b.dataset.preset === "deposit") { st.accountId = cash.id; st.toAccountId = bank.id; } else { st.accountId = bank.id; st.toAccountId = cash.id; }
        draw();
      });
      const mb = root.querySelector("#moreBtn"); if (mb) mb.onclick = () => { st.more = true; draw(); };
      const sg = root.querySelector("#stSeg"); if (sg) sg.querySelectorAll("button").forEach(b => b.onclick = () => { st.status = b.dataset.k; sg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); });
      const di = root.querySelector("#dIn"); if (di) di.onchange = () => { st.date = di.value || U.today(); if (st.date > U.today()) { st.status = "pending"; draw(); } };
      const ni = root.querySelector("#nIn"); if (ni) ni.oninput = () => { st.note = ni.value; };
      root.querySelector("#saveBtn").onclick = save;
      const del = root.querySelector("#delBtn"); if (del) del.onclick = async () => { if (await UI.confirm("למחוק את הפעולה?", "הפעולה תימחק והיתרות יתעדכנו.", "מחיקה", true)) { Actions.deleteTx(edit.id); sh.close(); } };
    };
    const save = () => {
      const amount = U.num(st.amount);
      if (!(amount > 0)) return UI.toast("הזינו סכום", "alert");
      if (!st.accountId) return UI.toast("בחרו חשבון", "alert");
      if (st.type === "transfer") { if (!st.toAccountId || st.toAccountId === st.accountId) return UI.toast("בחרו חשבון יעד אחר", "alert"); }
      else if (!st.categoryId) st.categoryId = st.type === "income" ? "ci5" : (s.categories.find(c => c.name === "שונות") || s.categories.find(c => c.kind === "expense")).id;
      const body = { type: st.type, amount, accountId: st.accountId, toAccountId: st.type === "transfer" ? st.toAccountId : null, categoryId: st.type === "transfer" ? null : st.categoryId, date: st.date, note: st.note.trim(), status: st.status };
      if (edit) { Engine.updateTx(edit.id, body); if (body.date > U.today() && !edit.source && body.type === "expense") edit.planned = true; Store.save(); UI.toast("הפעולה עודכנה"); }
      else { const t = Engine.addTx(body); Store.save(); UI.toast(st.type === "expense" ? `נוספה הוצאה ${U.money(amount)}` : st.type === "income" ? `נוספה הכנסה ${U.money(amount)}` : `הועברו ${U.money(amount)}`, "check"); Hooks.afterTxSave.forEach(f => f(t)); s.settings.defaultAccountId = s.settings.defaultAccountId || st.accountId; }
      sh.close();
    };
    draw();
  },
  openGeneric(edit) {
    const s = Store.state;
    const fields = [{ name: "amount", label: edit.type === "adjust" ? "שינוי ביתרה (+/−)" : "סכום", type: "amount" }, { name: "date", label: "תאריך", type: "date" }, { name: "note", label: "תיאור", type: "text" }];
    Form.open({
      title: "עריכת פעולה", fields, values: { amount: edit.amount, date: edit.date, note: edit.note },
      onSave: v => { const a = edit.type === "adjust" ? parseFloat(v.amount) : U.num(v.amount); if (!isFinite(a) || (edit.type !== "adjust" && a <= 0)) return "סכום לא תקין"; Engine.updateTx(edit.id, { amount: a, date: v.date || edit.date, note: v.note }); Store.save(); UI.toast("עודכן"); },
      onDelete: async () => { if (await UI.confirm("למחוק?", "הפעולה תימחק.", "מחיקה", true)) { Actions.deleteTx(edit.id); return true; } return false; },
    });
  },
};

/* ---------------- Goals ---------------- */
const Goals = {
  icons: ["target", "plane", "car", "house", "shield", "gift", "book", "health", "baby", "paw", "dumbbell", "smile"],
  form(g) {
    const s = Store.state, isNew = !g;
    g = g || { name: "", target: "", initial: 0, color: PALETTE[(s.goals.length + 1) % PALETTE.length], icon: "target", monthly: "", fromAccountId: (s.accounts.find(a => a.type === "bank") || s.accounts[0] || {}).id, day: s.settings.payday, deadline: "" };
    Form.open({
      title: isNew ? "יעד חיסכון חדש" : "עריכת יעד",
      fields: [
        { name: "name", label: "שם היעד", type: "text", placeholder: "לדוגמה: חופשה ביוון", autofocus: isNew },
        { name: "target", label: "סכום היעד", type: "amount" },
        ...(isNew ? [{ name: "initial", label: "כבר חסכתי", hint: "לא חובה", type: "amount" }] : []),
        { name: "monthly", label: "הפקדה חודשית קבועה", hint: "0 = בלי הוראה", type: "amount" },
        { name: "fromAccountId", label: "מאיזו קופה/חשבון", type: "select", options: Form.accOptions(a => a.type !== "credit") },
        { name: "day", label: "יום ההפקדה בחודש", type: "select", options: Form.dayOptions() },
        { name: "deadline", label: "תאריך יעד", hint: "לא חובה", type: "date" },
        { name: "icon", label: "אייקון", type: "icon", options: Goals.icons },
        { name: "color", label: "צבע", type: "color" },
      ],
      values: g,
      onSave: v => {
        const target = U.num(v.target); if (!v.name.trim()) return "תנו שם ליעד"; if (!(target > 0)) return "הזינו סכום יעד";
        const body = { name: v.name.trim(), target, monthly: U.num(v.monthly), fromAccountId: v.fromAccountId, day: Number(v.day) || s.settings.payday, deadline: v.deadline || "", icon: v.icon || "target", color: v.color || PALETTE[0] };
        if (isNew) {
          const ng = Object.assign({ id: U.uid(), initial: U.num(v.initial), startDate: U.today(), archived: false }, body);
          s.goals.push(ng); s.runs["goal:" + ng.id] = U.add(U.today(), -1);
        } else {
          if (body.monthly !== g.monthly || body.day !== g.day) { s.runs["goal:" + g.id] = U.add(U.today(), -1); }
          Object.assign(Engine.goal(g.id), body);
        }
        Store.save(); UI.toast(isNew ? "היעד נוצר" : "היעד עודכן", "target");
      },
      onDelete: isNew ? null : async () => {
        if (!(await UI.confirm("למחוק את היעד?", "ההפקדות ליעד יימחקו והכסף יחזור לחשבונות שמהם הופקד.", "מחיקה", true))) return false;
        s.goals = s.goals.filter(x => x.id !== g.id); s.transactions = s.transactions.filter(t => t.goalId !== g.id); delete s.runs["goal:" + g.id];
        Store.save(); UI.toast("היעד נמחק", "trash"); UI._sheets.forEach(r => UI.closeSheet(r)); return true;
      },
    });
  },
  open(id) {
    const g = Engine.goal(id); if (!g) return;
    const saved = Engine.goalSaved(id), pct = g.target ? saved / g.target : 0;
    const hist = Store.state.transactions.filter(t => t.goalId === id).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8);
    const daysToDeadline = g.deadline ? U.diff(U.today(), g.deadline) : null;
    const needMonthly = g.deadline && daysToDeadline > 0 ? Math.max(0, g.target - saved) / Math.max(1, daysToDeadline / 30.4) : null;
    const sh = UI.sheet(g.name, `<div style="display:grid;place-items:center;margin:4px 0 12px">${UI.ring(pct, g.color, 170, 16, `<span style="text-align:center;line-height:1.2">${Math.round(pct * 100)}%<small class="muted" style="display:block;font-size:12px;font-weight:400;font-family:var(--font-ui)">מהיעד</small></span>`)}</div>
      <div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><small>נחסך</small><b class="inc">${U.money(saved)}</b></div><div class="stat"><small>חסר</small><b>${U.money(Math.max(0, g.target - saved))}</b></div></div>
      ${needMonthly != null ? `<div class="banner info">${ico("bulb")}<span class="grow" style="font-size:14px">כדי להגיע ליעד עד ${U.short(g.deadline)} צריך כ־${U.money(needMonthly, { round: true })} בחודש${g.monthly ? ` (כרגע ${U.money(g.monthly)})` : ""}.</span></div>` : ""}
      <div class="btn-row" style="margin-bottom:14px"><button class="btn primary" data-gm="in">${ico("arrowDown", "sm")}הפקדה</button><button class="btn" data-gm="out">${ico("arrowUp", "sm")}משיכה</button><button class="btn" data-gm="edit" aria-label="עריכה">${ico("edit", "sm")}</button></div>
      ${hist.length ? `<div class="list">${hist.map(t => UI.txItem(t, { date: true })).join("")}</div>` : `<p class="muted" style="text-align:center;margin:0">עוד אין הפקדות</p>`}`);
    UI.after();
    sh.body.querySelectorAll("[data-gm]").forEach(b => b.onclick = () => { const k = b.dataset.gm; if (k === "edit") { Goals.form(g); return; } Goals.move(g, k); });
  },
  move(g, dir) {
    const s = Store.state;
    Form.open({
      title: dir === "in" ? `הפקדה ל${g.name}` : `משיכה מ${g.name}`,
      fields: [{ name: "amount", label: "סכום", type: "amount", autofocus: true }, { name: "acc", label: dir === "in" ? "מאיזו קופה/חשבון" : "לאיזה חשבון", type: "select", options: Form.accOptions(a => a.type !== "credit") }, { name: "date", label: "תאריך", type: "date" }],
      values: { acc: g.fromAccountId, date: U.today() },
      saveLabel: dir === "in" ? "הפקדה" : "משיכה",
      onSave: v => {
        const a = U.num(v.amount); if (!(a > 0)) return "הזינו סכום";
        if (dir === "out" && a > Engine.goalSaved(g.id) + .001) return "אין מספיק כסף ביעד";
        Engine.addTx({ type: "transfer", amount: a, accountId: dir === "in" ? v.acc : null, toAccountId: dir === "out" ? v.acc : null, goalId: g.id, goalDir: dir, date: v.date || U.today(), note: "" });
        Store.save(); UI.closeAll(); UI.toast(dir === "in" ? `הופקדו ${U.money(a)} ל${g.name}` : `נמשכו ${U.money(a)}`, "target");
      },
    });
  },
};

/* ---------------- Actions (event delegation) ---------------- */
const Actions = {
  tab: d => UI.go(d.tab),
  back: () => UI.back(),
  push: d => UI.push(d.view),
  add: d => TxSheet.open({ type: d.type || "expense" }),
  editTx: d => { const t = Store.state.transactions.find(x => x.id === d.id); if (t) TxSheet.open({ tx: t }); },
  deleteTx(id) {

const FileOut = {

    }

    const url = URL.createObjectURL(blob); const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();

};

/* ---------------- Exporter: xlsx מעוצב ---------------- */
const Exporter = {
  LIB: "https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js",
  load() {
    if (window.XLSX && window.XLSX.utils) return Promise.resolve(window.XLSX);
    return new Promise((res, rej) => { const s = document.createElement("script"); s.src = Exporter.LIB; s.onload = () => res(window.XLSX); s.onerror = () => rej(new Error("load")); document.head.appendChild(s); });
  },
  rows(E) {
    return Store.state.transactions.filter(t => t.type !== "adjust" && E.types[t.type] && t.date >= E.from && t.date <= E.to).sort((a, b) => a.date.localeCompare(b.date));
  },
  serial(ds) { const [y, m, d] = ds.split("-").map(Number); return (Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 864e5; },
  async run(E) {
    const rows = Exporter.rows(E);
    if (!rows.length) { UI.toast("אין נתונים בטווח שנבחר — נסו טווח אחר", "alert", { ms: 3500 }); return; }
    let X; try { X = await Exporter.load(); } catch (e) { UI.toast("לא הצלחנו לטעון את רכיב האקסל. בדקו חיבור לאינטרנט.", "alert"); return; }
    const TYPE = { expense: "הוצאה", income: "הכנסה", transfer: "העברה" };
